<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاعة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* The hall: every piece on its own plinth, numbered, in the same blue studio the pieces stand in. A card leads into its story. */
:root {
  color-scheme: light;
  --bg: #748ba1;
  --bg-deep: #5c7287;
  --ink: #fbf7f0;
  --ink-2: #e6ecf1;
  --gold: #d9a441;
  --gold-soft: #f1d79c;
  --night: #16202b;
  --f-display: "Reem Kufi", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { min-height: 100vh; background: radial-gradient(120% 70% at 50% 0%, #8299ae 0%, var(--bg) 45%, var(--bg-deep) 100%) fixed; color: var(--ink); font-family: var(--f-body); -webkit-tap-highlight-color: transparent }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px }

header { padding: clamp(28px, 7vw, 64px) 16px clamp(18px, 4vw, 34px); text-align: center }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1.1; text-shadow: 0 2px 20px #0d162055 }
.count { margin: .5rem 0 0; font-family: var(--f-display); font-size: .95rem; color: var(--gold-soft); letter-spacing: .02em }
.rule { width: 120px; height: 2px; margin: 18px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent) }

main { max-width: 1180px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: clamp(16px, 3vw, 28px) }

/* a card = a plinth: the piece, its number, its name */
.piece { position: relative; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
  background: radial-gradient(90% 70% at 50% 38%, #8197ac 0%, #6a8197 70%, #5d7389 100%);
  box-shadow: 0 18px 40px #0d162040, inset 0 0 0 1px #ffffff22; transition: transform .35s ease, box-shadow .35s ease }
.piece:hover { transform: translateY(-6px); box-shadow: 0 26px 54px #0d162066, inset 0 0 0 1px var(--gold) }
.stage { position: relative; aspect-ratio: 1; display: grid; place-items: center; padding: 34px 26px 40px }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transition: transform .6s ease;
  -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); mask-image: radial-gradient(closest-side, #000 72%, transparent 100%) }
.piece:hover .stage img { transform: scale(1.05) }
.num { position: absolute; top: 12px; inset-inline-start: 16px; font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; line-height: 1; color: var(--gold); text-shadow: 0 2px 12px #0d162066 }
.plate { padding: 14px 18px 18px; background: linear-gradient(180deg, #16202b00, #16202bcc 40%); margin-top: -36px; position: relative }
.plate h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; line-height: 1.3 }
.plate p { margin: .25rem 0 0; font-size: .92rem; color: var(--ink-2) }
.go { display: inline-flex; align-items: center; gap: 6px; margin-top: .7rem; font-family: var(--f-display); font-size: .9rem; color: var(--gold-soft) }
.go::after { content: "←"; transition: transform .3s ease }
.piece:hover .go::after { transform: translateX(-5px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<header>
  <h1>قاعة العرض</h1>
  <p class="count" id="count"></p>
  <div class="rule"></div>
</header>
<main id="hall"></main>
<script>
// the pieces, in the order of the hall; each card opens the piece's own page
const PIECES = [
  { slug: 'narmer-palette', title: 'صلاية نعرمر', label: 'نخن · نحو ٣١٠٠ قبل الميلاد' },
  { slug: 'pyramid-complex', title: 'المجموعة الهرمية', label: 'من حافة الماء إلى قبر الملك' },
  { slug: 'khafre', title: 'في حماية حورس', label: 'الجيزة · الأسرة الرابعة' },
  { slug: 'seated-scribe', title: 'الكاتب', label: 'قاعد متربّعًا على قاعدته' },
  { slug: 'harpist-relief', title: 'عازف الهارب', label: 'المقصورة الحمراء · حتشبسوت · الكرنك' },
  { slug: 'amarna-hall', title: 'تحت أشعة آتون', label: 'العمارنة · نحو ١٣٤٥ قبل الميلاد' },
  { slug: 'tut-harpooner', title: 'الملك على عوامة البردي', label: 'من مقبرة توت عنخ آمون' },
  { slug: 'djehuty', title: 'تحيّة الشمس', label: 'الإله جحوتي في هيئة البابون' },
  { slug: 'isis-osiris', title: 'إيزيس وأوزوريس', label: 'حكاية الوفاء والبعث' },
];
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
document.getElementById('count').textContent = `${ar(PIECES.length)} ${PIECES.length <= 10 ? 'قطع' : 'قطعة'}`;
document.getElementById('hall').innerHTML = PIECES.map((p, i) => `
  <a class="piece" href="../${p.slug}/">
    <div class="stage"><img src="img/${String(i + 1).padStart(2, '0')}.jpg" alt="${p.title}" loading="${i < 3 ? 'eager' : 'lazy'}"></div>
    <span class="num">${ar(i + 1)}</span>
    <div class="plate"><h2>${p.title}</h2><p>${p.label}</p><span class="go">ادخل الحكاية</span></div>
  </a>`).join('');
</script>
</body>
</html>
