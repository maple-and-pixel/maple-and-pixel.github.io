<title>المُعرِب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
:root{
  --desk:#EFE9DD; --paper:#FFFDF6; --ink:#1E3A7A; --muted:#6B7591; --rule:#C9D8EE; --margin:#E8A6A0;
  --red:#B0291F; --chip:#E4ECF8; --ok:#2B7650; --fix:#B5590C; --focus:#1E3A7A; --shade:rgba(30,40,70,.08);
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --f-head:"Aref Ruqaa","Amiri",serif;
  --f-tr:"Gentium Book Plus","Gentium Plus","Charis SIL","Noto Serif",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#12161F; --paper:#1A202C; --ink:#B9CCF5; --muted:#8C97B0; --rule:#2B3548; --margin:#7A3B38;
  --red:#FF8F84; --chip:#243049; --ok:#6FCB98; --fix:#F0A55E; --focus:#B9CCF5; --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#12161F; --paper:#1A202C; --ink:#B9CCF5; --muted:#8C97B0; --rule:#2B3548; --margin:#7A3B38;
  --red:#FF8F84; --chip:#243049; --ok:#6FCB98; --fix:#F0A55E; --focus:#B9CCF5; --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ar);font-size:17px;line-height:1.7;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tr{font-family:var(--f-tr);font-style:italic;unicode-bidi:isolate}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
h1{font-family:var(--f-head);font-weight:700;font-size:1.9rem;line-height:1.3;margin:0;color:var(--red)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:3px 14px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.picker{display:grid;gap:6px;margin:6px 0 14px}
.story{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.story b{font-family:var(--f-head);font-weight:400;font-size:1.05rem;min-width:7em;color:var(--muted)}
.pill{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:1px 12px;font-size:.88rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.where{font-family:var(--f-head);font-weight:400;font-size:1.35rem;margin:8px 0 2px}
.muted{color:var(--muted);font-size:.85rem}
.list{display:grid;gap:18px;margin-top:12px}
/* the notebook sheet */
.nb-s{background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--shade),0 6px 18px var(--shade);
  padding:10px 18px 14px;border-inline-start:3px double var(--margin);min-width:0;overflow-wrap:anywhere}
.nb-s[dir="ltr"] .nb-l,.nb-s[dir="ltr"] .nb-h{font-family:var(--f-hand)}
.nb-row{border-bottom:1px solid var(--rule);min-height:2.1em;padding:.15em 0;line-height:1.75}
.nb-tr{color:var(--red);font-size:1.12rem;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.nb-num{font-family:var(--f-hand);font-style:normal}
.nb-ref{margin-inline-start:auto;font-size:.78rem;color:var(--muted);font-style:normal}
.nb-gl{color:var(--ink);text-align:start}
.nb-h{color:var(--red)}
.nb-w{font-weight:700}
.nb-l1{padding-inline-start:1.8em}
.nb-l2{padding-inline-start:3.6em}
.nb-rt{float:inline-end;margin-inline-start:12px;color:var(--ink)}
.nb-x{text-decoration:underline wavy var(--red);text-decoration-thickness:1px;text-underline-offset:4px}
.nb-gold{display:inline-block;margin-inline-start:10px;font-family:var(--f-ar);font-size:.8rem;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:0 8px;line-height:1.6}
.nb-u .nb-w{text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.nb-u::after{content:" ؟";color:var(--muted)}
.nb-note{font-size:.82rem;color:var(--muted);font-family:var(--f-ar)}
@media (max-width:560px){body{font-size:16px}.nb-s{padding:8px 12px 12px}.nb-rt{float:none;display:block}.story b{min-width:0;width:100%}h1{font-size:1.6rem}}

/* Layout: a working tool — the input column (sticky) beside the result column on a wide screen, stacked on a phone.
   Flat surfaces divided by hairlines; red is kept for one thing, the transliteration, as in the course notebooks. */
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --ink:#1C2840; --muted:#5F6880; --line:#DCE1E9; --accent:#A82A20; --sel:#E9EEF6;
  --f-ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif; --f-title:"Aref Ruqaa","Amiri",serif;
  --f-tr:"Gentium Book Plus","Gentium Plus","Charis SIL","Noto Serif",serif;
  --f-hg:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic",sans-serif;
  /* the notebook renderer's tokens, mapped onto this page */
  --desk:var(--bg); --paper:var(--panel); --rule:var(--line); --red:var(--accent); --chip:var(--sel); --margin:transparent; --shade:transparent;
  --f-hand:var(--f-tr); --f-head:var(--f-ar);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --panel:#161D27; --ink:#E6ECF6; --muted:#A4AEC2; --line:#2C384B; --accent:#F4978B; --sel:#222C3B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --panel:#161D27; --ink:#E6ECF6; --muted:#A4AEC2; --line:#2C384B; --accent:#F4978B; --sel:#222C3B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:17px;line-height:1.65;margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hg,textarea.in.h,.pal button,.hist .hg{font-family:var(--f-hg);font-style:normal;-webkit-text-stroke:.025em currentColor}
.pal .k button,.pal .tabs button{-webkit-text-stroke:0}
.tr{font-family:var(--f-tr);font-style:italic;unicode-bidi:isolate}
.muted{color:var(--muted);font-size:.85rem}
.legal{color:var(--muted);font-size:.75rem;text-align:center;padding:20px 16px 28px}
.legal a{color:inherit}

.app{max-width:1240px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header: name, school, script, language — one line */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.optbtn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:1px 12px;font-size:.88rem}
.optbtn[aria-expanded="true"]{background:var(--sel)}
@media (max-width:560px){
  h1{font-size:1.5rem}
  .bar .grow{display:none}
  .optbtn{display:inline-block;margin-inline-start:auto}
  .opts{flex-basis:100%;order:9;padding-top:4px}
  .opts:not(.open){display:none}
}
h1{font-family:var(--f-title);font-weight:700;font-size:1.7rem;line-height:1.2;margin:0;color:var(--ink)}
.field{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.field select{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:2px 8px;color:var(--ink)}
.field input{accent-color:var(--ink)}
.grow{flex:1}
.tabs{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:3px;padding:2px;background:var(--panel)}
.tabs button{border:0;background:none;padding:2px 12px;font-size:.88rem;border-radius:2px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:700}

/* two columns */
.cols{display:grid;gap:16px;align-items:start}
.left{display:contents}
.side{order:1}.main{order:2}.tools{order:3}
@media (min-width:900px){.cols{grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:20px}
  .left{display:grid;gap:12px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);
    max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .main{order:0}}
.side,.main,.tools,.left{min-width:0}
.tools .panel{padding:12px;display:grid;gap:10px}
.tools .panel>:first-child{border-top:0;padding-top:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}

/* input column */
.side .panel{padding:12px;display:grid;gap:10px}
textarea.in{width:100%;min-height:3.2em;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical;line-height:1.55}
textarea.in:focus{border-color:var(--ink);outline:none}
textarea.in.h{font-family:var(--f-hg);font-size:1.9rem}
textarea.in.t{font-family:var(--f-tr);font-style:italic;font-size:1.2rem;color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:2px 12px;font-size:.88rem}
.btn:hover{background:var(--sel)}
.go{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700;padding:3px 22px}
.go:hover{background:var(--ink);opacity:.9}
.go:disabled{opacity:.45;cursor:default}
.status{font-size:.85rem;color:var(--muted);min-height:1.3em}
.status.err{color:var(--accent)}
.pal{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pal .row{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pal b{font-weight:400;font-size:.78rem;color:var(--muted);width:100%}
.pal button{font-family:var(--f-hg);font-size:1.35rem;line-height:1;min-width:1.9em;height:1.9em;border:1px solid var(--line);border-radius:2px;background:var(--panel);padding:0}
.pal .k button{font-family:var(--f-tr);font-size:1.05rem}
.pal .row.k{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;direction:ltr}
.pal .row.k button{width:auto;height:2.1em}
.pal button:hover{background:var(--sel)}
.pal .more{display:none}
.pal.open .more{display:flex}
.pal .all{flex-direction:column;gap:6px}
.pal .all b{font-weight:400;font-size:.78rem;color:var(--muted)}
.pal .q{font:inherit;font-family:var(--f-tr);padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink)}
.pal .tabs{display:flex;flex-wrap:wrap;gap:3px}
.pal .tabs button{font-family:var(--f-tr);font-size:.8rem;min-width:2.3em;height:1.9em}
.pal .tabs button[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.ex{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.ex button{border:0;background:none;text-align:start;padding:2px 4px;border-radius:2px;color:var(--ink)}
.ex button:hover{background:var(--sel)}
.ex .hg{font-size:1.55rem;direction:ltr;line-height:1.35}

/* typing from the keyboard: what is being typed and the signs it can be */
.ime{display:flex;flex-wrap:wrap;align-items:center;gap:4px;direction:ltr;border:1px solid var(--line);border-radius:3px;padding:4px 6px;background:var(--bg)}
.ime .buf{font-family:var(--f-tr);font-style:italic;color:var(--accent);padding-inline-end:6px;border-inline-end:1px solid var(--line);margin-inline-end:2px}
.ime button{display:inline-grid;grid-auto-flow:column;align-items:center;gap:3px;border:1px solid transparent;background:none;border-radius:2px;padding:0 5px}
.ime button .hg{font-size:1.45rem;line-height:1.3}
.ime button small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ime button[aria-selected="true"]{border-color:var(--ink);background:var(--panel)}
.ime .none{color:var(--muted);font-size:.85rem}
.poly{direction:rtl}
.poly .hg{font-size:1.45rem;line-height:1.3;padding-inline-end:6px;border-inline-end:1px solid var(--line);margin-inline-end:2px}
.poly button{border:1px solid var(--line);background:var(--panel);font-size:.85rem;padding:2px 8px;line-height:1.5}
.poly button.tr{font-family:var(--f-tr);font-style:italic}
.poly button:hover{background:var(--sel)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6em,1fr));gap:2px 6px;border-top:1px solid var(--line);padding-top:10px;direction:ltr}
.keys div{display:flex;align-items:baseline;gap:5px;font-size:.9rem}
.keys kbd{font-family:var(--f-tr);font-size:.85rem;border:1px solid var(--line);border-radius:2px;padding:0 4px;min-width:1.5em;text-align:center;background:var(--bg)}
.keys .tr{color:var(--accent)}
.keys .hg{font-size:1.15rem}
.keys .wide{grid-column:1/-1;direction:rtl;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}

/* result column */
.out{display:grid;gap:12px}
.out .empty{padding:20px 4px;color:var(--muted)}
.sent{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 18px 16px;display:grid;gap:12px;animation:fade .18s ease-out;scroll-margin-top:12px}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.trans{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.trans .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.trans p{margin:0;font-size:1.8rem;font-weight:700;line-height:1.45;text-wrap:balance;min-width:0;flex:1 1 8em}
.trans[dir="ltr"] p{font-family:var(--f-tr);font-size:1.5rem;font-weight:400}
.lit{font-size:.78rem;color:var(--muted)}
.read{display:flex;flex-wrap:wrap;gap:4px 16px;direction:ltr;padding:8px 0;border-block:1px solid var(--line)}
.wd{display:grid;justify-items:center}
.wd .hg{font-size:2rem;line-height:1.3}
.wd .t{font-family:var(--f-tr);font-style:italic;color:var(--accent);font-size:.98rem}
.wd.u .t::after{content:" ؟";color:var(--muted)}
.sent .nb-s{background:none;box-shadow:none;border:0;border-radius:0;padding:0}
.sent .nb-row{border-bottom-color:var(--line)}
.notes{margin:0;padding:0;list-style:none;font-size:.88rem;color:var(--muted);display:grid;gap:2px}
.notes li{padding-inline-start:1.4em;text-indent:-1.4em}
.notes li::before{content:"⚖";display:inline-block;width:1.4em;text-indent:0;color:var(--ink)}
.notes .tr{color:var(--accent)}
.notes .who{color:var(--ink)}
.wd{border:1px solid transparent;background:none;border-radius:3px;padding:0 4px;color:inherit}
.wd:hover{background:var(--sel)}
.wd[aria-expanded="true"]{border-color:var(--ink);background:var(--sel)}
.cp{margin-inline-start:auto;border:1px solid var(--line);background:none;border-radius:3px;padding:0 10px;font-size:.8rem;color:var(--muted)}
.cp:hover{color:var(--ink);background:var(--sel)}
.wp{border:1px solid var(--line);border-radius:3px;background:var(--panel);display:grid;grid-template-columns:auto minmax(0,1fr);animation:fade .15s ease-out}
.wp .head{display:grid;justify-items:center;align-content:center;gap:2px;padding:10px 16px;border-inline-end:1px solid var(--line);direction:ltr}
.wp .head .hg{font-size:2.4rem;line-height:1.2}
.wp .head .t{font-family:var(--f-tr);font-style:italic;color:var(--accent);font-size:1.1rem}
.wp dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);font-size:.92rem}
.wp dt,.wp dd{margin:0;padding:5px 10px;border-bottom:1px solid var(--line)}
.wp dt{color:var(--muted);font-size:.82rem}
.wp dl>:nth-last-child(-n+2){border-bottom:0}
.wp .en{direction:ltr;text-align:start;font-family:var(--f-tr);font-size:.92rem}
.wp .sp{display:flex;flex-wrap:wrap;gap:4px 14px;direction:ltr;justify-content:flex-end}
.wp .sp span{display:inline-flex;align-items:baseline;gap:4px}
.wp .sp .hg{font-size:1.4rem}
.wp .sp small{color:var(--muted);font-variant-numeric:tabular-nums}
.wp .x{grid-column:1/-1;justify-self:end;border:0;background:none;color:var(--muted);padding:0 8px;font-size:1.1rem}
@media (max-width:560px){.wp{grid-template-columns:1fr}.wp .head{border-inline-end:0;border-bottom:1px solid var(--line)}}
.hist{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.hist .top{display:flex;align-items:center;justify-content:space-between}
.hist .top button{border:0;background:none;color:var(--muted);font-size:.8rem;padding:0 4px}
.hist .top button:hover{color:var(--ink)}
.hist button.h{border:0;background:none;text-align:start;padding:2px 4px;border-radius:2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist button.h:hover{background:var(--sel)}
.hist button.h.hg{font-size:1.45rem;line-height:1.35}
.hist .tag{font-family:var(--f-tr);font-style:italic;font-size:.75rem;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin:0 2px;vertical-align:middle;-webkit-text-stroke:0}
.hist .tag.ar{font-family:var(--f-ar);font-style:normal}
.hist .moreh{justify-self:start;border:0;background:none;color:var(--muted);font-size:.85rem;padding:0 4px}
.hist .moreh:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.sent,.wp{animation:none}}
@media (max-width:560px){.trans p{font-size:1.45rem}textarea.in.h{font-size:1.7rem}.sent{padding:12px 12px 14px}}
</style>

<div class="app" dir="rtl" lang="ar">
  <header class="bar">
    <h1>المُعرِب</h1>
    <div class="tabs" role="group" aria-label="طريقة الكتابة">
      <button type="button" id="m-h" aria-pressed="true">هيروغليفي</button>
      <button type="button" id="m-t" aria-pressed="false">حروف لاتيني</button>
    </div>
    <span class="grow"></span>
    <button type="button" class="optbtn" id="optbtn" aria-expanded="false" aria-controls="opts">الإعدادات</button>
    <div class="opts" id="opts">
      <label class="field" for="school">المدرسة
        <select id="school"><option>جاردنر · نور الدين</option></select>
      </label>
      <label class="field" for="allen"><input type="checkbox" id="allen"> ملاحظات ⚖</label>
      <div class="tabs" role="group" aria-label="لغة النتيجة">
        <button type="button" id="l-ar" aria-pressed="true">عربي</button>
        <button type="button" id="l-en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="cols">
    <div class="left">
    <aside class="side">
      <div class="panel">
        <textarea class="in h" id="in" dir="ltr" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="الجملة"></textarea>
        <div class="ime" id="ime" hidden></div>
        <div class="ime poly" id="poly" hidden></div>
        <div class="acts">
          <button type="button" class="btn go" id="go" disabled>أعرب</button>
          <button type="button" class="btn" id="sp">مسافة</button>
          <button type="button" class="btn" id="del" aria-label="امسح آخر علامة">⌫</button>
          <button type="button" class="btn" id="clr">امسح</button>
          <button type="button" class="btn" id="more">كل العلامات</button>
          <button type="button" class="btn" id="keys" aria-expanded="false">المفاتيح</button>
        </div>
        <div class="keys" id="keytable" hidden></div>
        <div class="status" id="st" role="status"></div>
        <div class="pal" id="pal"></div>
      </div>
    </aside>
    <aside class="tools" aria-label="أمثلة وسجل">
      <div class="panel">
        <div class="ex" id="ex"></div>
        <div class="hist" id="hist" hidden></div>
      </div>
    </aside>
    </div>
    <main class="main">
      <div class="out" id="out" aria-live="polite"><p class="empty">بيجهّز القاموس…</p></div>

    "ṯ": ["2nd person, singular, feminine", "مخاطَبة، مفرد، مؤنث"], f: ["3rd person, singular, masculine", "غائب، مفرد، مذكر"],
    s: ["3rd person, singular, feminine", "غائبة، مفرد، مؤنث"], n: ["1st person, plural", "متكلم، جمع"],
    tn: ["2nd person, plural", "مخاطَب، جمع"], sn: ["3rd person, plural, common", "غائب، جمع"],
    ny: ["1st person, dual", "متكلم، مثنى"], sny: ["3rd person, dual", "غائب، مثنى"],
    "2f": ["2nd person, feminine singular / plural", "مخاطَب، مفردة مؤنثة / جمع"],
    "3c": ["3rd person, feminine / common", "غائب، مؤنث / عام"],
  };
  const SUF = {j: "j", k: "k", "ṯ": "ṯ", f: "f", s: "s", sj: "s", sy: "s", n: "n", tn: "tn", "ṯn": "tn", sn: "sn", ny: "ny", sny: "sny"};
  const DEP = {wj: "j", tw: "k", "ṯw": "k", "ṯn": "2f", tn: "2f", sw: "f", sj: "s", st: "3c", n: "n", sn: "sn"};
  const IND = {jnk: "j", ntk: "k", "ntṯ": "ṯ", ntf: "f", nts: "s", jnn: "n", nttn: "tn", ntsn: "sn"};
  const DEM = {pn: "ms", tn: "fs", nn: "pl", pf: "ms", tf: "fs", nf: "pl", pw: "ms", tw: "fs", nw: "pl", "pꜣ": "ms", "tꜣ": "fs", "nꜣ": "pl", jpn: "pl", jptn: "pl"};
  const DEMG = {ms: ["singular, masculine", "مفرد، مذكر"], fs: ["singular, feminine", "مفرد، مؤنث"], pl: ["plural", "جمع"]};
  const NEG = new Set(["nj", "nn", "n", "tm", "jmj"]);
  const FORMS = {
    sdmf: ["sḏm.f (form) in present", "صيغة sḏm.f (مضارع)"], sdmnf: ["sḏm.n.f (form) in past", "صيغة sḏm.n.f (ماضي)"],
    sdmjnf: ["sḏm.jn.f (form)", "صيغة sḏm.jn.f"], stat: ["old perfective (stative)", "الفعل التام القديم"],
    inf: ["infinitive", "مصدر"], ninf: ["narrative infinitive", "مصدر سردي"], part: ["participle", "اسم فاعل"],
    ppart: ["passive participle", "اسم مفعول"], rel: ["relative form", "صيغة صلة"], reln: ["relative form sḏm.n.f", "صيغة صلة sḏm.n.f"],
    imp: ["imperative", "فعل أمر"], aux: ["auxiliary ꜥḥꜥ.n", "ꜥḥꜥ.n فعل مساعد"],
  };
  const FN = {
    OBJ: ["object", "مفعول به"], ATTR: ["attribute", "نعت"], GEN: ["direct genitive", "مضاف إليه"],
    GEN_PART: ["genitival adjective (indirect genitive)", "أداة الإضافة غير المباشرة"], APPOS: ["apposition", "بدل"],
    ADVERBIAL: ["adverbial", "ظرف"], POBJ: ["noun after preposition", "اسم مجرور"], CIRC: ["circumstantial clause", "جملة حالية"],
    SPEC: ["specification", "تمييز"], DATE: ["date", "تاريخ"], PARTICLE: ["particle", "أداة"], VERB_HEAD: ["verb", "فعل"],
  };

  const clean = (t) => (t || "").replace(/[\[\]⸢⸣()〈〉{}<>?!]/g, "");
  const parts = (t) => clean(t).split(".");

  function fkey(s) {
    s = s || "";
    if (s.includes("صلة")) return s.includes("sḏm.n.f") ? "reln" : "rel";
    if (s.includes("sḏm.n.f")) return "sdmnf";
    if (s.includes("sḏm.jn.f")) return "sdmjnf";
    if (s.includes("sḏm.f")) return "sdmf";
    if (s.includes("التام")) return "stat";
    if (s.includes("مصدر سردي")) return "ninf";
    if (s.includes("مصدر")) return "inf";
    if (s.includes("اسم مفعول")) return "ppart";
    if (s.includes("اسم فاعل")) return "part";
    if (s.includes("أمر")) return "imp";
    if (s.includes("ꜥḥꜥ.n")) return "aux";
    return "";
  }
  function upFromAr(p) {
    p = (p || "").split("+")[0];
    if (/ضمير|اسم إشارة|اسم موصول/.test(p)) return "PRON";
    if (/حرف جر/.test(p)) return "ADP";
    if (/أداة/.test(p)) return "PART";
    if (/اسم فاعل|اسم مفعول|فعل|مصدر/.test(p)) return "VERB";
    if (/صفة/.test(p)) return "ADJ";
    if (/عدد/.test(p)) return "NUM";
    if (/ظرف/.test(p)) return "ADV";
    if (/علم|مكان|لقب|عرش/.test(p)) return "PROPN";
    return "NOUN";
  }

  function kind(toks) {
    const has = (f) => toks.some(f);
    if (has(k => k.tag === "VERB_HEAD" && k.fk === "ninf")) return ["narrative infinitive", "مصدر سردي"];
    if (has(k => k.tag === "VERB_HEAD")) return ["verbal sentence", "جملة فعلية"];
    if (has(k => parts(k.t)[0] === "pw")) return ["nominal sentence with pw", "جملة اسمية بـpw"];
    const pr = toks.find(k => k.tag === "PRED");
    if (pr) {
      if (pr.up === "ADP" || pr.up === "ADV") return ["adverbial sentence", "جملة ظرفية"];
      if (pr.up === "ADJ") return ["adjectival sentence", "جملة وصفية"];
      if (pr.fk === "stat") return ["sentence with old perfective", "جملة بالفعل التام القديم"];
      return ["nominal sentence", "جملة اسمية"];
    }
    if (has(k => k.tag === "SUBJ") && has(k => k.tag === "ADVERBIAL")) return ["adverbial sentence", "جملة ظرفية"];
    if (toks.length && NEG.has(parts(toks[0].t)[0])) return ["negative sentence", "جملة منفية"];
    return ["phrase", "تركيب"];
  }

  function pronCat(k, L) {
    const st = parts(k.t)[0];
    if (IND[st]) return (L ? "ضمير مستقل، " : "independent pronoun, ") + P[IND[st]][L];
    if (DEM[st] && (k.tag === "ATTR" || st === "pw" || !DEP[st])) return (L ? "اسم إشارة، " : "demonstrative pronoun, ") + DEMG[DEM[st]][L];
    if (DEP[st]) return (L ? "ضمير متعلق، " : "dependent pronoun, ") + P[DEP[st]][L];
    return L ? "ضمير" : "pronoun";
  }

  function fnText(k, L, verbal) {
    if (k.tag === "SUBJ") return L ? (verbal ? "فاعل" : "مبتدأ") : "subject";
    if (k.tag === "PRED") {
      if (k.up === "ADJ") return L ? "خبر وصفي" : "adjectival predicate";
      if (k.up === "ADP" || k.up === "ADV") return L ? "خبر ظرفي" : "adverbial predicate";
      return L ? "خبر" : (verbal || k.fk ? "predicate" : "nominal predicate");
    }
    return FN[k.tag] ? FN[k.tag][L] : "";
  }

  function desc(k, L, verbal) {
    const fn = fnText(k, L, verbal);
    const as = (cat, f) => !f ? cat : (L ? cat + "، " + f : cat + ", as " + f);
    if (k.tag === "VERB_HEAD") return FORMS[k.fk] ? FORMS[k.fk][L] : (L ? "فعل" : "verb");
    if (k.tag === "DATE") return fn;
    if (k.up === "PRON") return as(pronCat(k, L), k.tag === "ATTR" ? "" : fn);
    if (FORMS[k.fk]) return as(FORMS[k.fk][L], fn);
    if (k.up === "ADJ") return k.tag === "ATTR" ? (L ? "صفة، نعت" : "adjective (epithet)") : as(L ? "صفة" : "adjective", fn);
    if (k.up === "PART" || k.tag === "PARTICLE") {
      const neg = NEG.has(parts(k.t)[0]);
      return neg ? (L ? "أداة نفي" : "negative particle") : (L ? "أداة" : "particle");
    }
    if (k.up === "NUM") return as(L ? "عدد" : "number", fn);
    if (k.up === "PROPN") return as(L ? "اسم علم" : "proper noun", fn);
    if (k.up === "ADV") return as(L ? "ظرف" : "adverb", fn === FN.ADVERBIAL[L] ? "" : fn);
    if (k.up === "INTJ") return L ? "أداة نداء" : "interjection";

  // the indented lines under a word: .n / .jn of the verb form, stative endings, suffix pronouns
  function subs(k, L) {
    const ps = parts(k.t), out = [];
    let rest = ps.slice(1);
    if ((k.fk === "sdmnf" || k.fk === "reln") && rest[0] === "n") {
      out.push(["." + rest.shift(), L ? "علامة الماضي" : "particle of past"]);
    } else if (k.fk === "sdmjnf" && rest[0] === "jn") {
      out.push(["." + rest.shift(), L ? "الأداة jn" : "particle jn"]);
    }
    if (k.fk === "stat" && rest.length) {
      out.push(["." + rest.join("."), L ? "نهاية الفعل التام القديم" : "ending of the old perfective"]);
      return out;
    }
    rest.forEach(s => {
      const p = SUF[s];
      if (!p) return;
      let role;
      if (k.up === "ADP") role = L ? "مجرور بحرف الجر" : "object of the preposition";
      else if (k.up === "PART" || k.tag === "PARTICLE") role = L ? "مبتدأ" : "as subject";
      else if (k.fk === "inf" || k.fk === "ninf") role = L ? "متصل بالمصدر" : "attached to the infinitive";
      else if (k.tag === "VERB_HEAD" || (FORMS[k.fk] && k.fk !== "part" && k.fk !== "ppart")) role = L ? "فاعل" : "as subject";

  }

  // rows: {lvl, w, text, right, mark, note}
  function rows(toks, L, mode) {
    const verbal = toks.some(k => k.tag === "VERB_HEAD");
    const R = [];
    const gold = mode === "gold" && L === 1;
    const goldText = (k) => {
      let s = k.arPos ? k.arPos + "، " + k.arFn : k.arFn;

    const push = (k, lvl, text, right) => R.push({lvl, w: clean(k.t), text, right, mark: k.mark, note: k.note, unsure: k.unsure});
    const pushSubs = (k, lvl) => { if (!gold) subs(k, L).forEach(([w, t]) => R.push({lvl, w, text: t})); };

        R.push({lvl: 0, w: words, text: head, right, mark: k.mark, note: k.note, unsure: k.unsure});
        pushSubs(k, 1);
        for (let m = i + 1; m < j; m++) {
          const o = toks[m];
          let t;
          if (gold) t = goldText(o);
          else {
            const cat = o.up === "PRON" ? pronCat(o, L) : FORMS[o.fk] ? FORMS[o.fk][L] : "";
            t = cat ? (L ? cat + " مجرور" : cat + " after preposition") : FN.POBJ[L];
          }
          push(o, 1, t);
          pushSubs(o, 2);
        }
        i = j - 1;
        continue;
      }
      const lvl = k.tag === "POBJ" ? 1 : 0;
      const right = !gold && k.tag === "VERB_HEAD" ? st + ": " + (L ? "فعل" : "verb") : "";
      push(k, lvl, gold ? goldText(k) : desc(k, L, verbal), right);
      pushSubs(k, lvl + 1);
    }
    return R;
  }

  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const bdi = (c, s) => { const b = el("bdi", c, s); b.dir = "ltr"; return b; };

  // one notebook sentence. opts: {n, lang 0|1, mode, ref, typeAr, compare, noGloss (the page shows the translation itself)}
  function sheet(toks, opts) {
    const L = opts.lang;
    const box = el("article", "nb-s");
    box.dir = L ? "rtl" : "ltr";
    const top = el("div", "nb-row nb-tr");
    top.append(el("span", "nb-num", opts.n + "- "), bdi("tr", toks.map(k => clean(k.t)).join(" ")));
    if (opts.ref) { const r = el("span", "nb-ref"); r.append(bdi("", opts.ref)); top.append(r); }
    box.append(top);
    const gl = opts.trans || toks.map(k => k.gloss).filter(Boolean).join(" ");
    if (gl && !opts.noGloss) { const g = el("div", "nb-row nb-gl"); g.dir = opts.glossDir || "rtl"; g.textContent = "← " + gl; box.append(g); }
    const ty = opts.mode === "gold" && L === 1 && opts.typeAr ? opts.typeAr : kind(toks)[L];
    box.append(el("div", "nb-row nb-h", (L ? "*الإعراب: (" : "*parsing: (") + ty + ")"));
    rows(toks, L, opts.mode).forEach(r => {
      const row = el("div", "nb-row nb-l nb-l" + r.lvl + (r.mark && opts.compare ? " nb-x" : "") + (r.unsure ? " nb-u" : ""));
      if (r.right) { const rt = el("span", "nb-rt", "/ "); rt.append(bdi("tr", r.right.split(":")[0])); rt.append(":" + r.right.split(":").slice(1).join(":")); row.append(rt); }
      row.append(bdi("tr nb-w", r.w), document.createTextNode(": " + r.text + (L ? "" : ".")));
      if (r.mark && opts.compare) row.append(el("span", "nb-gold", r.mark));
      box.append(row);
      if (r.note && opts.mode === "gold" && L === 1) box.append(el("div", "nb-row nb-note nb-l" + Math.min(r.lvl + 1, 2), r.note));
    });
    return box;
  }

  return {sheet, fkey, upFromAr, kind};
})();

<script>

// Python's negative indexing (out[j - 1] with j = 0) is kept through at().
(function (root) {

  }

    for (const [d, tag] of [[-1, "p1"], [1, "n1"], [-2, "p2"], [2, "n2"]]) {

      if (Math.abs(d) === 1) f.push(tag + "u:" + w[1]);
    }

  }
  const SAYS = "500024";   // ꞽ «says»: jn.f / jn X, never with .n (Gardiner §436)
  const ALIAS = {"sš": [["sẖꜣ", "+alias"], ["sẖꜣw", "+alias"]], "sšw": [["sẖꜣw", ""]]};   // +alias weighs 0.1

        out.push({id: f.id, freq: f.freq, upos: argmax(f.upos), via: "form" + via});
        seen.add(f.id);
      }
      for (const i of (D.lemma_index[k] || [])) {
        if (seen.has(i)) continue;
        const e = D.lemmas[i];
        const upos = e.upos && Object.keys(e.upos).length ? argmax(e.upos) : (POS_NAME[e.pos] !== undefined ? POS_NAME[e.pos] : e.pos);
        out.push({id: i, freq: e.corpus_freq, upos, via: "lemma" + via});

    }

      let out = [];                                                    // sš = TLA zẖꜣ

      const seen0 = new Set(out.map(c => c.id));
      out = out.concat(this._exact(k, "").filter(c => !seen0.has(c.id)));
      if (!out.length) for (const k2 of (this.data.loose_index[k.split("-").join("")] || [])) out = out.concat(this._exact(k2, "+loose"));
      if (strip) {

        for (const [k3, label] of strippedKeys(k, weakJ)) {

        }
        tier3.sort((a, b) => b.freq - a.freq);
        out = out.concat(tier3);
      }
      for (const c of out) c.upos = POS_NAME[c.upos] !== undefined ? POS_NAME[c.upos] : c.upos;
      return out;
    }

  }

  // ---- retokenize.py ---------------------------------------------------------------------------
  const GENITIVE_PARTICLES = new Set(["n", "nt", "nw"]);
  const SUFFIXES = {"j": ["pron.1s"], "k": ["pron.2ms"], "ṯ": ["pron.2fs"], "f": ["pron.3ms"], "s": ["pron.3fs"],
    "sn": ["pron.3pl"], "tn": ["pron.2pl"], "tw": ["passive"], "kw": ["stative.1s"], "tj": ["stative.2s", "stative.3fs"],
    "n": ["sdm.n", "pron.1pl"]};

  function key(text) {
    let t = text.normalize("NFC").replace(/[()\[\]]/g, "");
    return t.split("z").join("s").toLowerCase();
  }
  const segStem = (s) => key(s.text.split(".")[0]);

      const parts = form.split(/[\s\-]+/).map(key);

      while (i < n && this.t[i].cls === "PART_INTRO") {
        if (this.t[i].has_pron) { this._set(i, "PART", "SUBJ", "", ["R04", "R07"]); return this._predicate(i + 1); }
        this._set(i, "PART", "PARTICLE", "", ["R04"]);
        i++;
      }
      while (i < n && (this.t[i].cls === "PART_ENCL" || (this.t[i].key === "r" && this.t[i].has_pron && i > 0 && this.t[i - 1].cls === "PART_INTRO"))) {
        this._set(i, "PART", "PARTICLE", "", ["R04"]);
        i++;
      }
      if (i >= n) return;
      const t = this.t[i];
      const afterParticle = i > 0 && ["PART_INTRO", "PART_ENCL"].includes(this.t[i - 1].cls);

      if (this._pwInitial(i)) return;

      if (i + 2 === n && this._nameAt(i)) {                             // also ḏdj rn.f
        this._set(i, "PROPN", "PRED", "", ["R42"]);
        this._set(i + 1, "NOUN", "SUBJ", "", ["R42", "R01"]);
        return;
      }
      if (i + 2 < n && this.t[i + 1].key === "pw" && ["jr", "jrj"].includes(this.t[i + 2].key) && this.t[i + 2].has_n
          && t.cls === "OPEN" && !t.sufs.length) {
        this._set(i, "VERB", "PRED", "مصدر", ["R43", "R35"]);
        this._set(i + 1, "PRON", "SUBJ", "", ["R35"]);
        this._set(i + 2, "VERB", "ATTR", "صيغة صلة sḏm.n.f", ["R43", "R32"]);
        let j = i + 3;
        if (!this.t[i + 2].has_pron && j < n && this.t[j].nounish()) {
          this._set(j, this.t[j].nominalUpos(), "SUBJ", "", ["R43", "R32"]);
          j = this._nounPhrase(j + 1);
        }
        return this._rest(j, true);
      }
      if (afterParticle && this.t[i - 1].key === "jw" && t.cls === "OPEN" && !t.has_n && (t.passive || (
          t.has_pron && t.canBe("VERB") && i + 1 < n && this._argument(i + 1)))) return this._verbal(i);

      if (t.cls === "PRON_IND" && i + 1 < n && this.t[i + 1].key === "pw") {   // jnk pw · ntf pw jnk
        this._set(i, "PRON", "PRED", "", ["R35"]);
        this._set(i + 1, "PRON", "SUBJ", "", ["R35"]);
        let k = i + 2;
        if (k < n && this.t[k].cls === "PRON_IND") { this._set(k, "PRON", "APPOS", "", ["R17"], "بدل من pw"); k++; }
        return this._rest(k, true);
      }
      if (t.cls === "PRON_IND") {
        this._set(i, "PRON", "SUBJ", "", ["R06"]);
        if (this._free(i + 1)) {
          const p = this.t[i + 1];
          if (p.cls === "OPEN" && !p.sufs.length && p.canBe("VERB") && p.top_upos === "VERB") {
            this._set(i + 1, "VERB", "PRED", "اسم فاعل", ["R06", "R30"]);
            if (i + 2 < n && this._free(i + 2) && this.t[i + 2].nounish()) {
              this._set(i + 2, this.t[i + 2].nominalUpos(), "OBJ", "", ["R30"]);
              return this._rest(this._nounPhrase(i + 3), true);
            }
          } else this._set(i + 1, p.cls === "PROPN" ? "PROPN" : p.adjectival() && !p.sufs.length ? "ADJ" : "NOUN", "PRED", "", ["R06"]);   // jnk nfr · jnk Rꜥ
        }
        return this._rest(i + 2, true);
      }
      if (t.cls === "PRON_DEP" && afterParticle) { this._set(i, "PRON", "SUBJ", "", ["R07"]); return this._predicate(i + 1); }
      if (t.cls === "NEG" || (t.cls === "GENPART" && t.key === "n" && i === 0)) return this._negation(i);
      if (afterParticle && t.cls === "ADV" && i + 1 < n && this.t[i + 1].nounish() && this.t[i + 1].cls !== "PREP") {
        this._set(i, t.entry.upos, "ADVERBIAL", "", ["R25"]);
        return this._clause(i + 1);
      }
      if (afterParticle && (t.cls === "PREP" || t.cls === "ADV")) return this._predicate(i);
      if (t.cls === "PREP" || t.cls === "ADV") return this._rest(i, true);
      if (t.key === "ꜥḥꜥ" && t.has_n && i + 1 < n && this.t[i + 1].verbish()) {
        this._set(i, "VERB", "PARTICLE", "ꜥḥꜥ.n (فعل مساعد)", ["R38"]);
        return this._verbal(i + 1);
      }
      if (i === 0 && t.cls === "OPEN" && !t.sufs.length && t.verbish() && !t.adjectival()) {
        let j = 1;                                                     // šm swt · sḏm rk n.j · jꜥ ṯw: the imperative
        while (j < n && this.t[j].cls === "PART_ENCL") j++;
        const nxt = j < n ? this.t[j] : null;
        if (nxt === null || (j > 1 && nxt.cls === "PREP" && nxt.has_pron)
            || (nxt.cls === "PRON_DEP" && (j + 1 === n || !this.t[j + 1].nounish()))) {
          this._set(i, "VERB", "VERB_HEAD", "أمر", ["R39"]);
          for (let m = 1; m < j; m++) this._set(m, "PART", "PARTICLE", "", ["R04"]);
          if (nxt !== null && nxt.cls === "PRON_DEP") { this._set(j, "PRON", "OBJ", "", ["R10"]); j++; }
          return this._rest(j, true);
        }
      }
      if (i === 0 && t.cls === "OPEN" && !t.sufs.length && t.canBe("VERB") && !t.adjectival() && i + 1 < n
          && this.t[i + 1].cls === "PREP" && this.t[i + 1].has_pron) {
        this._set(i, "VERB", "VERB_HEAD", "أمر", ["R39"]);
        this._set(i + 1, "ADP", "ADVERBIAL", "", ["R24"]);
        let j = i + 2;
        if (j < n && this._argument(j)) {
          this._set(j, this.t[j].nominalUpos(), "OBJ", "", ["R39"]);
          j = this._nounPhrase(j + 1, "OBJ");
        }
        return this._rest(j, true);
      }
      if (t.key === "ptr" && i + 1 < n) {
        this._set(i, "PRON", "PRED", "", ["R41"]);
        const s_ = this.t[i + 1];
        let j;
        if (s_.verbish() && s_.has_n) { this._set(i + 1, "VERB", "SUBJ", "صيغة صلة", ["R41", "R32"]); j = i + 2; }
        else if (s_.cls === "OPEN" && !s_.sufs.length && s_.canBe("VERB")) { this._set(i + 1, "VERB", "SUBJ", "اسم فاعل", ["R41", "R31"]); j = i + 2; }
        else { this._set(i + 1, s_.nominalUpos(), "SUBJ", "", ["R41"]); j = this._nounPhrase(i + 2); }
        return this._rest(j, true);
      }
      if (t.cls === "OPEN" && !t.sufs.length && i + 1 < n && (t.adjectival() || t.canBe("ADJ"))) {
        let k = i + 1;
        while (k < n && (this.t[k].cls === "PART_ENCL" || (this.t[k].cls === "PREP" && this.t[k].has_pron))) k++;
        const s = k < n ? this.t[k] : null;
        const gap = k > i + 1;
        const participle = s !== null && gap && s.cls === "OPEN" && !s.sufs.length && s.canBe("VERB");
        if (s !== null && !(s.cls === "PRON_DEP" && !t.adjectival())
            && (s.cls === "PRON_DEP" || (s.verbish() && s.has_n) || participle || (s.nounish() && (t.adjectival() || s.has_pron || gap)))) {
          this._set(i, "ADJ", "PRED", "", ["R36"]);
          for (let m = i + 1; m < k; m++) {
            if (this.t[m].cls === "PART_ENCL") this._set(m, "PART", "PARTICLE", "", ["R04"]);
            else this._set(m, "ADP", "ADVERBIAL", "", ["R24"]);
          }
          let j;
          if (s.cls === "PRON_DEP") { this._set(k, "PRON", "SUBJ", "", ["R36", "R07"]); j = k + 1; }
          else if (s.verbish() && s.has_n) { this._set(k, "VERB", "SUBJ", "صيغة صلة", ["R36", "R32"]); j = k + 1; }
          else if (participle && !s.nounish()) { this._set(k, "VERB", "SUBJ", "اسم فاعل", ["R36", "R31"]); j = k + 1; }
          else { this._set(k, s.nominalUpos(), "SUBJ", "", ["R36"]); j = this._nounPhrase(k + 1); }
          return this._rest(j, true);
        }
      }
      if (t.stative) { this._set(i, "VERB", "VERB_HEAD", "الفعل التام القديم", ["R12"]); return this._rest(i + 1, true); }
      if (t.narrativeInfinitive()) {
        this._set(i, "VERB", "VERB_HEAD", "مصدر سردي", ["R11"]);
        let j = i + 1;
        if (j < this.t.length && this._free(j) && (this.t[j].nounish() || this.t[j].verbish()) && !this.t[j].has_n && this.t[j].cls === "OPEN") {
          this._set(j, !this.t[j].verbish() ? this.t[j].nominalUpos() : "VERB", "OBJ", "", ["R11"]);
          j = this._nounPhrase(j + 1);
        }
        return this._rest(j, true);
      }
      if ((t.cls === "OPEN" || t.cls === "NOUN") && t.has_pron && !t.has_n && t.canBe("NOUN") && i + 2 < n
          && this.t[i + 1].key === "ḥr" && !this.t[i + 1].has_pron && this.t[i + 2].canBe("VERB")) {
        this._set(i, t.nominalUpos(), "SUBJ", "", ["R03"]);
        return this._predicate(i + 1);
      }
      if (t.cls === "OPEN" && !t.has_n && t.canBe("VERB") && i + 1 < n
          && (this.t[i + 1].cls === "PRON_DEP" || (t.has_pron && this.t[i + 1].has_n && this.t[i + 1].verbish()))) return this._verbal(i);
      if (t.verbish() && t.has_pron && i + 1 < n && this.t[i + 1].key === "pw"
          && (i + 2 === n || ["PREP", "ADV"].includes(this.t[i + 2].cls))) {   // sḏm.f pw (+ adverbial: wbn.f pw m ꜣḫt)
        this._set(i, "VERB", "PRED", "sḏm.f", ["R35"]);
        this._set(i + 1, "PRON", "SUBJ", "", ["R35"]);
        return this._rest(i + 2, true);
      }
      if (t.verbish() && (t.has_n || t.has_pron || t.passive || this.prev_was_date)) return this._verbal(i);
      if (t.nounish() || t.cls === "TITLE" || t.cls === "PROPN") {
        this._set(i, t.cls === "PROPN" ? "PROPN" : t.nominalUpos(), "SUBJ", "", ["R03"]);
        const j = this._nounPhrase(i + 1);
        if (this._pwSentence(i, j)) return;
        if (j >= n) {
          const last = this.out[n - 1];
          if (n - 1 > i && last.fn === "GEN" && this.t[n - 1].canBe("VERB")) this._set(n - 1, "VERB", "PRED", "الفعل التام القديم", ["R12", "R13", "R15"]);
          else { this.out[i].fn = "APPOS"; this.out[i].rules = ["R17"]; }
          return;
        }
        return this._predicate(j);

      if (t.verbish()) return this._verbal(i);

    }

    _pwSentence(i, j) {
      if (j >= this.t.length || this.t[j].key !== "pw" || !this._free(j)) return false;
      this.out[i].fn = "PRED"; this.out[i].rules = ["R35"];
      if (this.t[i].entry) this.out[i].upos = this.t[i].entry.upos;
      this._set(j, "PRON", "SUBJ", "", ["R35"]);
      this._pwTail(j + 1);
      return true;
    }
    _pwInitial(i) {
      const n = this.t.length, h = this.t[i];
      let k = null;
      for (let m = i + 1; m < Math.min(i + 4, n); m++) if (this.t[m].key === "pw") { k = m; break; }
      if (k === null || (h.cls !== "OPEN" && h.cls !== "NOUN") || h.has_pron
          || this.t.slice(i + 1, k).some(m => ((m.cls !== "OPEN" && m.cls !== "NOUN") && !BODY.has(m.key)) || m.has_pron)) return false;
      const mid = this.t.slice(i + 1, k);
      let upos, form, mfn, mrules;
      if (h.key === "nb" && mid.length) [upos, form, mfn, mrules] = ["NOUN", "", "GEN", ["R16"]];
      else if ((mid.length && BODY.has(mid[0].key)) || (h.adjectival() && h.top_upos !== "VERB")) [upos, form, mfn, mrules] = ["ADJ", "", "SPEC", ["R20"]];

      else return false;
      this._set(i, upos, "PRED", form, ["R35"]);
      for (let m = i + 1; m < k; m++) this._set(m, this.t[m].nominalUpos(), mfn, "", mrules);

    }
    _nameAt(j) {
      const n = this.t.length;
      return j + 1 < n && this._free(j) && this._free(j + 1) && !this.t[j].sufs.length
        && (this.t[j].cls === "PROPN" || ["PROPN", "NOUN"].includes(this.t[j].top_upos)) && (j === 0 || this.t[j - 1].cls !== "PREP")
        && this.t[j + 1].key === "rn" && this.t[j + 1].has_pron;
    }

    _nameClause(j) {                                                   // R42 inside a sentence: NAME rn.f
      if (!this._nameAt(j)) return false;
      this._set(j, "PROPN", "PRED", "", ["R42"], "جملة اسمية «اسمه/اسمها …» في محل صفة");
      this._set(j + 1, "NOUN", "SUBJ", "", ["R42", "R01"]);
      return true;
    }

    _pwTail(k) {
      const n = this.t.length;
      while (k < n && this.t[k].cls === "PART_ENCL") { this._set(k, "PART", "PARTICLE", "", ["R04"]); k++; }
      const p = k < n ? this.t[k] : null;
      if (p !== null && k === n - 1 && k >= 2 && this._free(k) && p.cls === "OPEN" && !p.sufs.length
          && p.canBe("NOUN") && this.t[k - 2].has_pron) {                 // sn.j pw sš: apposition to pw
        this._set(k, "NOUN", "APPOS", "", ["R17"], "بدل من pw");
        return;
      }
      if (p !== null && this._free(k) && p.cls === "OPEN" && !p.sufs.length && p.top_upos === "VERB") {
        this._set(k, "VERB", "PRED", "اسم فاعل", ["R35", "R30"]);
        k++;
        if (this._nameClause(k)) k += 2;                                // s pw wn ḫw.n-jnpw rn.f
        else if (k < n && this._free(k) && this._argument(k)) {
          this._set(k, this.t[k].nominalUpos(), "OBJ", "", ["R30"]);
          k = this._nounPhrase(k + 1);
        }
      }
      this._rest(this._nounPhrase(k, null, true), true);
    }

    _predicate(j) {
      const n = this.t.length;
      while (j < n && this.t[j].cls === "PART_ENCL") { this._set(j, "PART", "PARTICLE", "", ["R04"]); j++; }
      if (j >= n) return;
      const p = this.t[j];
      if (p.key === "n" && j + 1 < n && this.t[j + 1].cls === "PRON_IND") {
        this._set(j, "PART", "PARTICLE", "", ["R34"]);
        this._set(j + 1, "PRON", "SUBJ", "", ["R34", "R06"], "⚖ آلن §11.7: مبتدأ منفي");
        return this._predicate(j + 2);
      }
      if (p.cls === "ADV") { this._set(j, p.entry.upos, "PRED", "", ["R03"]); return this._rest(j + 1, true); }
      if (p.cls === "OPEN" && !p.sufs.length && p.canBe("VERB") && j > 0 && this.t[j - 1].has_pron
          && at(this.out, j - 1) && at(this.out, j - 1).fn === "SUBJ") {
        this._set(j, "VERB", "PRED", "الفعل التام القديم", ["R12", "R13"]);
        return this._rest(j + 1, true);
      }
      if (p.cls === "PREP") {
        if (p.key === "m" && j + 1 < n && this.t[j + 1].personLike()) {
          this._set(j, "ADP", "PRED", "", ["R05"]);
          this._set(j + 1, "NOUN", "PRED", "", ["R05"]);
        } else {
          this._set(j, "ADP", "PRED", "", ["R03"]);
          if (this._free(j + 1)) {
            const o = this.t[j + 1];
            const inf = ["ḥr", "m", "r"].includes(p.key) && o.cls === "OPEN"
              && (o.top_upos === "VERB" || ((o.key || "").length > 2 && o.key.endsWith("t") && o.canBe("VERB")));   // r jrt, r jjt
            this._set(j + 1, inf ? "VERB" : o.nominalUpos(), "POBJ", inf ? "مصدر" : "", ["R03"]);
          }
        }
        return this._rest(j + 2, true);
      }
      if (p.has_pron && (p.verbish() || (p.cls === "OPEN" && p.canBe("VERB") && j + 1 < n && this._argument(j + 1)))) {

        if (j + 1 < n && this._argument(j + 1)) {

        return this._rest(j + 1, true);
      }
      let later = null, prepLater = null;
      for (let m = j + 1; m < n; m++) if (this.t[m].cls === "OPEN" && this.t[m].has_pron && !this.t[m].has_n && this.t[m].canBe("VERB") && this.t[m - 1].cls !== "PREP") { later = m; break; }
      for (let m = j + 2; m < n; m++) if (this.t[m].cls === "PREP" && (this.t[m].key === "ḥr" || this.t[m].key === "m")) { prepLater = m; break; }
      if (p.verbish() && !p.sufs.length && later === null && prepLater !== null && this._argument(j + 1)) {
        this._set(j, "VERB", "ATTR", "اسم فاعل", ["R30"]);
        this._set(j + 1, this.t[j + 1].nominalUpos(), "OBJ", "", ["R30"]);
        return this._predicate(this._nounPhrase(j + 2));
      }
      if (p.verbish() && !p.sufs.length && later !== null) {
        this._set(j, "VERB", "ATTR", "اسم فاعل", ["R30"]);
        this._set(later, "VERB", "PRED", "sḏm.f", ["R08"], "⚖ آلن: SUBJECT–sḏm.f / جاردنر §148");
        return this._rest(j + 1, true);
      }
      if (p.verbish()) { this._set(j, "VERB", "PRED", "الفعل التام القديم", ["R12", "R13", "R15"]); return this._rest(j + 1, true); }

    }

    _verbal(i) {
      const n = this.t.length, t = this.t[i];
      if (this.prev_was_date && !t.has_pron && !t.has_n) {
        this._set(i, "VERB", "VERB_HEAD", "مصدر", ["R11"]);
        if (this._free(i + 1) && this.t[i + 1].nounish()) { this._set(i + 1, "NOUN", "SUBJ", "", ["R11"]); return this._rest(i + 2, true); }

      let [form, rule] = t.has_n ? ["sḏm.n.f", "R09"] : ["sḏm.f", "R08"];
      const marker = /\.(jn|ḫr|kꜣ)(?=\.|$)/.exec(t.w.surface);
      if (marker && !t.has_n) form = `sḏm.${marker[1]}.f`;            // sḏm.jn.f · sḏm.ḫr.f · sḏm.kꜣ.f
      this._set(i, "VERB", "VERB_HEAD", form, [rule]);
      const subjInVerb = t.has_pron;
      let j = i + 1;
      while (j < n && this.t[j].cls === "PART_ENCL") { this._set(j, "PART", "PARTICLE", "", ["R04"]); j++; }
      if (j < n && this.t[j].cls === "PRON_DEP") {
        const r10 = !subjInVerb && j + 1 < n && this.t[j + 1].nounish();
        this._set(j, "PRON", "OBJ", "", r10 ? ["R10"] : [rule]);
        j++;
      }
      const c = j < n ? this.t[j] : null;
      if (c !== null && this._free(j) && c.cls === "OPEN" && !c.has_n && c.canBe("VERB") && (
          (SAY.has(t.key) && c.has_pron)
          || (SEE.has(t.key) && !c.sufs.length && j + 1 < n && this.t[j + 1].has_pron && this.t[j + 1].nounish()))) {
        this._set(j, "VERB", "VERB_HEAD", "sḏm.f", ["R40"]);
        let k = j + 1;
        if (!c.has_pron && k < n) { this._set(k, this.t[k].nominalUpos(), "SUBJ", "", ["R40"]); k++; }
        else if (k < n && this.t[k].cls === "PRON_DEP") { this._set(k, "PRON", "OBJ", "", ["R40"]); k++; }
        return this._rest(k, true);
      }
      if (!subjInVerb && j < n && this._argument(j)) {
        const prevOut = at(this.out, j - 1);
        this._set(j, this.t[j].nominalUpos(), "SUBJ", "", [rule].concat(prevOut && prevOut.fn === "OBJ" ? ["R10"] : []));
        if (j + 2 < n && this._argument(j + 1) && this.t[j + 2].cls === "DEM") j += 1;   // gm.n s st tn: the object
        else j = this._nounPhrase(j + 1);
      }
      if (j < n && this._argument(j) && !this._nameAt(j) && !this.out.slice(i + 1, j).some(o => o && o.fn === "OBJ")) {
        this._set(j, this.t[j].nominalUpos(), "OBJ", "", [rule]);
        j = this._nounPhrase(j + 1, "OBJ");
      }
      return this._rest(j, true);
    }

    _argument(j) {
      const t = this.t[j];
      return this._free(j) && (t.nounish() || (t.cls === "OPEN" && !t.sufs.length && t.canBe("NOUN")));
    }

    _negation(i) {
      const n = this.t.length, t = this.t[i];
      if (i + 1 < n && this.t[i + 1].cls === "PRON_IND") {
        this._set(i, "PART", "PARTICLE", "", ["R34"]);
        this._set(i + 1, "PRON", "SUBJ", "", ["R06"]);

                  swt: "إذن", grt: "كذلك", js: "حقاً", tr: "إذن", "ḥm": "حقاً", "m-ꜥ": "مع", "r-ꜥ": "عند",
                  "ẖr": "مع", jr: "أما", "m-ḥꜣt": "أمام", "r-sꜣ": "بعد", "ḥꜣ": "حول", "ẖr-ḥꜣt": "قبل", "m-ẖnw": "داخل",
                  "m-ḳꜣb": "وسط", "ḥr-jb": "وسط", "r-ḏr": "كل", pw: "هو", "jsṯ": "و", jst: "و"};
  // dependent pronouns as objects join the verb before them (rḫ.kw sw «أعرفه»)
  const DEP_OBJ = {wj: "ني", tw: "ك", "ṯw": "ك", "ṯn": "كم", sw: "ه", sj: "ها", st: "ها", sn: "هم", n: "نا"};
  const STATIVE_PASSIVE = {"96700": "وُضع", "550028": "وُضع", "851711": "وُضع"};   // rḏj.w ḥr «وُضع على»

  const PERSON = {j: "1s", k: "2m", "ṯ": "2f", f: "3m", s: "3f", n: "1p", tn: "2p", "ṯn": "2p", sn: "3p"};
  const STATIVE = [[/\.(kw|kj|k)$/, "1s"], [/\.(wjn|wn)$/, "1p"], [/\.(tjwnj|tjwn)$/, "2p"], [/\.(tj|tw|t)$/, "3f"]];
  const INTRO = {jw: "", mk: "ها", "mṯ": "ها", jst: "و", "jsṯ": "و", "ꜥḥꜥ": "ثم", tj: "", "jḫ": "إذن"};
  const PREP_SUF = {r: "إلي", m: "في", "ḥr": "علي"};
  const PRON_PERSON = {wj: "1s", jnk: "1s", tw: "2m", "ṯw": "2m", ntk: "2m", "ṯn": "2f", "ntṯ": "2f", sw: "3m", ntf: "3m",
                       sj: "3f", sy: "3f", st: "3f", nts: "3f", n: "1p", jnn: "1p", sn: "3p", ntsn: "3p"};
  const PRON_AR = {"1s": "أنا", "2m": "أنت", "2f": "أنتِ", "3m": "هو", "3f": "هي", "1p": "نحن", "2p": "أنتم", "3p": "هم"};
  const NOT_AR = {"1s": "لستُ", "2m": "لستَ", "2f": "لستِ", "3m": "ليس", "3f": "ليست", "1p": "لسنا", "2p": "لستم", "3p": "ليسوا"};
  const INNI = {"1s": "إنني", "2m": "إنك", "2f": "إنكِ", "3m": "إنه", "3f": "إنها", "1p": "إننا", "2p": "إنكم", "3p": "إنهم"};
  const FIVE = new Set(["أب", "أخ"]);                                   // أبوك / أبيك / أبي
  const ADV_INTRO = {jw: "", mk: "ها", "mṯ": "ها", jst: "و", "jsṯ": "و", tj: "", "jḫ": "إذن"};
  const ACTIVE_STATIVE = new Set(["95620"]);                           // rḫ.kw «I know» (Gardiner §320): present, active

  // names with no Arabic meaning (MEASURE.md §2م ب, step 3): the known names first (longest run of the name's parts),
  // the rest letter by letter in the usual Egyptological way (ḏ «ج», ṯ «ت», ꜥ «ع»; no vowels added)
  const NAMES = {"rꜥw": "رع", "rꜥ": "رع", "jmn": "آمون", "jmnw": "آمون", "ptḥ": "بتاح", "wsjr": "أوزير", "jnpw": "أنوبيس",
    "jnp": "أنوبيس", "ḥrw": "حور", "ḥwt-ḥrw": "حتحور", "ḥwt-ḥr": "حتحور", "ꜣst": "إيزيس", "nbt-ḥwt": "نفتيس", "stẖ": "ست",
    "stḫ": "ست", "gbb": "جب", "nwt": "نوت", "šw": "شو", "tfnwt": "تفنوت", "jtmw": "أتوم", "jtm": "أتوم", "ḏḥwtj": "تحوت",
    "mnṯw": "مونتو", "mnṯ": "مونتو", "sbk": "سوبك", "sbkw": "سوبك", "mnw": "مين", "ḫnmw": "خنوم", "mꜣꜥt": "ماعت",
    "sḫmt": "سخمت", "njt": "نيت", "ḥꜥpj": "حعبي", "bꜣstt": "باستت", "ḫprj": "خبري", "nḫbt": "نخبت", "wꜣḏt": "واجيت",
    "ḫntj-jmntjw": "خنتي إمنتيو", "snfrw": "سنفرو", "ḫwfw": "خوفو", "ḫꜥ-f-rꜥw": "خفرع", "mn-kꜣw-rꜥw": "منكاورع",
    "ḏsr": "زوسر", "wnjs": "ونيس", "ttj": "تيتي", "ppj": "بيبي", "ppy": "بيبي", "jmn-m-ḥꜣt": "أمنمحات",
    "s-n-wsrt": "سنوسرت", "z-n-wsrt": "سنوسرت", "mnṯw-ḥtp": "منتوحتب", "nꜥr-mr": "نعرمر", "kmt": "مصر",
    "ꜣbḏw": "أبيدوس", "mn-nfr": "منف", "wꜣst": "طيبة", "jwnw": "هليوبوليس", "ꜣbw": "إلفنتين", "kpnj": "جبيل",
    "tꜣ-mḥw": "الدلتا", "mḥw": "الدلتا", "tꜣ-šmꜥw": "الصعيد", "šmꜥw": "الصعيد", "zꜣ-nht": "سنوهي",
    "jmj-r": "المشرف على", "mjr": "المشرف على"};
  const LETTER = {"ꜣ": "ا", "j": "ي", "y": "ي", "ꜥ": "ع", "w": "و", "b": "ب", "p": "ب", "f": "ف", "m": "م", "n": "ن",
    "r": "ر", "l": "ل", "h": "ه", "ḥ": "ح", "ḫ": "خ", "ẖ": "خ", "z": "س", "s": "س", "š": "ش", "q": "ق", "ḳ": "ق",
    "k": "ك", "g": "ج", "t": "ت", "ṯ": "ت", "d": "د", "ḏ": "ج"};
  const nameKey = t => t.toLowerCase().replace(/[ꞽï]/g, "j").replace(/i̯/g, "j").replace(/[.=()\[\]⸢⸣〈〉]/g, "");
  function spell(c) {
    let s = c.replace(/ꜥw$/, "ꜥ"), out = "";
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (i === 0 && ch === "j") { out += s[1] === "w" ? "إ" : "إي"; if (s[1] === "y") i++; continue; }   // Jpj «إيبي»
      if (i === 0 && ch === "ꜣ") { out += "أ"; continue; }
      if (ch === "j" && s[i - 1] === "j") continue;                     // jj = ي
      if (LETTER[ch] === undefined) return null;
      out += LETTER[ch];
    }
    return out;
  }
  function transliterate(t) {
    const parts = nameKey(t).split(/[-\s]+/).filter(Boolean), out = [];
    for (let i = 0; i < parts.length;) {
      let j = parts.length;
      while (j > i && NAMES[parts.slice(i, j).join("-")] === undefined) j--;
      if (j > i) { out.push(NAMES[parts.slice(i, j).join("-")]); i = j; continue; }
      const a = spell(parts[i]); if (a === null) return null;
      out.push(a); i++;
    }
    return out.join(" ") || null;
  }

  function makeTranslator(ar, base, verbs, plural) {
    verbs = verbs || {}; plural = plural || {};
    const clean = s => s.split("،")[0].replace(/\s*\([^)]*\)/g, "").trim();
    function suffixOf(k) {
      const p = k.t.split(".");
      if (p.length < 2 || !["NOUN", "PROPN", "ADP"].includes(k.upos)) return null;
      const last = p[p.length - 1];
      return SUF[last] !== undefined ? last : null;
    }
    function attach(word, suf, fn) {
      let w = word.replace(/^ال/, "");
      if (FIVE.has(w) && suf !== "j") w += ["POBJ", "GEN"].includes(fn) ? "ي" : "و";
      if (w.endsWith("ة")) w = w.slice(0, -1) + "ت";
      return w + SUF[suf];
    }
    function word(k) {
      if (k.heed) return k.heed === "pl" ? "خذوا حذركم" : "خذ حذرك";        // ꜥḥꜣ ṯw (idioms below)
      if (/[\[\]⸢⸣〈〉]/.test(k.t)) k = {...k, t: k.t.replace(/[\[\]⸢⸣〈〉]/g, "")};   // [m] = m restored by the editor
      const suf = suffixOf(k), b = k.t.split(".")[0];
      if (k.upos === "PRON" && k.fn === "SUBJ" && PRON_PERSON[b] && !suf) return PRON_AR[PRON_PERSON[b]];
      if (b.includes("-") && CLOSED[b]) { const ls = lastSuffix(k.t); return ls ? CLOSED[b] + SUF[ls] : CLOSED[b]; }   // m-ḳꜣb.sn «وسطهم» whatever the tag   // jsṯ wj «وأنا»
      if (k.upos === "PRON" && DEM[b] && !ar[k.tla]) return DEM[b];
      if (k.upos === "VERB" && verbs[k.tla] && !ar[k.tla]) { const v = verbForm(k); if (v) return v; }
      if (k.upos === "NOUN" && plural[k.tla] && isPlural(k)) return suf ? attach(plural[k.tla], suf, k.fn) : plural[k.tla];
      if (k.upos === "ADP" && suf && (PREP_SUF[b] || CLOSED[b])) return PREP_SUF[b] ? PREP_SUF[b] + (suf === "j" ? "ّ" : SUF[suf]) : CLOSED[b].replace(/ـ$/, "") + SUF[suf];
      if (k.upos === "ADV" && !suf && CLOSED[b]) return CLOSED[b];          // jm «هناك», not a gold «فيها»
      if (suf && base[k.tla]) return attach(clean(base[k.tla]), suf, k.fn);
      if (ar[k.tla]) return clean(ar[k.tla]);
      const bare = k.t.split(".")[0];
      if (suf && PREP_SUF[bare] && k.upos === "ADP") return PREP_SUF[bare] + (suf === "j" ? "ّ" : SUF[suf]);
      if (CLOSED[bare] !== undefined && ["ADP", "PRON", "PART", "ADV"].includes(k.upos))
        return suf ? CLOSED[bare].replace(/ـ$/, "") + SUF[suf] : CLOSED[bare];
      if (verbs[k.tla]) { const p = verbs[k.tla].split("|"); return p[6] || p[0]; }   // a verb not tagged VERB: its masdar
      if (/[A-ZꜢꜤḤḪŠḎṮḲẔ]/.test(k.t)) { const a = transliterate(k.t); if (a) return a; }
      return k.t;
    }
    // a verb on its own (the literal translation, or a verb the rules did not place): its form from the إعراب
    function verbForm(k) {
      const t = k.t, f = k.form || "";
      if (/ꜥḥꜥ\.n/.test(t) || f.includes("ꜥḥꜥ.n")) return "ثم";
      if (f.includes("أمر")) return conj(k, "2m", null, "imper");
      if (f.includes("مصدر")) { const m = conj(k, null, null, "masdar"), suf = lastSuffix(t); return m && suf ? attach(m, suf) : m; }
      const stative = f === "الفعل التام القديم", st = STATIVE.find(([re]) => re.test(t));
      const passive = /\.tw(\.|$)/.test(t) || (stative && (verbs[k.tla] || "").split("|")[3] && !/\.(kw|kj)$/.test(t) && !ACTIVE_STATIVE.has(k.tla));
      const past = stative || f === "sḏm.n.f" || /\.n(\.|$)/.test(t) || /\.jn(\.|$)/.test(t);
      const suf = stative ? null : lastSuffix(t);
      const person = stative ? (st ? st[1] : "3m") : suf ? PERSON[suf] : "3m";
      return conj(k, person, past ? "past" : "present", passive ? "passive" : "active", stative);
    }
    const isPlural = k => { const b = k.t.split(".")[0], l = (k.lemma || "").replace(/[.=()]/g, ""); return (/w$/.test(b) && !/w$/.test(l)) || (/wt$/.test(b) && !/wt$/.test(l)); };
    const indefinite = (k, w) => k.upos === "NOUN" && !suffixOf(k) ? w.replace(/^ال/, "") : w;
    const definite = (k, w) => w === "امرأة" ? "المرأة" : k.upos === "PROPN" || suffixOf(k) || w.startsWith("ال") || !/^[؀-ۿ]/.test(w) ? w : "ال" + w;
    const feminine = w => /[ةى]$/.test(w) || /ها$/.test(w);
    const femToken = k => feminine(clean(base[k.tla] || ar[k.tla] || "")) || (k.upos === "NOUN" && /t$/.test(k.t.split(".")[0]));
    const tidy = s => s.replace(/ ، /g, "، ").replace(/ـ /g, "").replace(/(^| )و /g, "$1و");

    // A noun phrase from i: head + direct genitives, adjectives, demonstratives, n + genitive.
    function phrase(toks, i, stop, indef) {
      let head = indef ? indefinite(toks[i], word(toks[i])) : word(toks[i]), dem = null, out = [], j = i + 1;
      while (j < stop) {
        const k = toks[j];
        if (k.upos === "PRON" && k.fn === "ATTR" && DEM[k.t]) { dem = DEM[k.t]; j++; continue; }
        if (k.fn === "ATTR" && ["nb", "nbt"].includes(k.t)) { head = "كل " + indefinite(toks[i], head); j++; continue; }   // wdpw nb «كل ساقٍ»
        if (k.fn === "GEN_PART" || (k.fn === "GEN" && k.t === "n")) { out.push("من"); j++; continue; }
        if (k.fn === "GEN" || k.fn === "SPEC" || (k.fn === "ATTR" && k.upos === "ADJ")) { out.push(word(k)); j++; continue; }
        break;
      }
      if (dem) head = suffixOf(toks[i]) || toks[i].upos === "PROPN" ? head + " " + dem : dem + " " + definite(toks[i], head);
      return {text: [head, ...out].join(" "), next: j, fem: feminine(head)};
    }
    const words = (toks, from, to) => toks.slice(from, to).map(word).join(" ");

    function nameClause(toks, i) {
      const k = toks[i], r = toks[i + 1];
      if (!r || !(k.rules || []).includes("R42") || k.fn !== "PRED" || r.fn !== "SUBJ") return null;
      const suf = suffixOf(r) || "f";
      return attach(base[r.tla] || "اسم", suf) + " " + word(k);
    }

    function pwSentence(toks) {
      const p = toks.findIndex(k => k.t === "pw" && k.fn === "SUBJ");
      if (p < 1) return null;
      const n = toks.length, first = toks[0];
      if (first.form === "sḏm.f" && p === 1) {                       // sḏm.f pw «هذا يعني: إنه يسمع» (+ wbn.f pw m ꜣḫt)
        const pr = PERSON[lastSuffix(first.t)] || "3m";
        return {text: tail(toks, 2, ["هذا يعني:", INNI[pr], conj(first, pr, "present") || word(first)]), rule: "sḏm.f pw"};
      }
      if ((first.rules || []).includes("R43") || (toks[p + 1] && /^jr\.n/.test(toks[p + 1].t))) {   // INF pw jr.n(.f) X
        const rel = toks[p + 1];
        if (!rel) return null;
        const suf = rel.t.split(".").pop();
        let j = p + 2, doer = DID.f;
        if (DID[suf] && rel.t.includes(".n.")) doer = DID[suf];
        else if (j < n && toks[j].fn === "SUBJ") { const ph = phrase(toks, j, n); doer = "فعله " + ph.text; j = ph.next; }
        const a = phrase(toks, 0, p);
        return {text: `${definite(first, a.text)} هو ما ${doer} ${words(toks, j, n)}`.trim(), rule: "مصدر + pw"};
      }
      const a = phrase(toks, 0, p, true);
      if (a.next !== p) return null;
      let j = p + 1;
      const after = toks[j];
      if (after && after.fn === "APPOS" && j === n - 1)                  // A pw B
        return {text: after.upos === "PRON" ? `${word(after)} ${a.text}`                // ntf pw jnk «أنا هو»
          : `${definite(after, word(after))} ${feminine(word(after)) ? "هي" : "هو"} ${a.text}`, rule: "A pw B"};
      if (after && ["ATTR", "PRED"].includes(after.fn) && after.upos === "VERB" && /^wn(\.w|\(\.?w\))?$/.test(after.t)) {   // A pw wn(.w) …
        j++;
        const name = nameClause(toks, j);
        const rest = name ? name + (j + 2 < n ? " " + words(toks, j + 2, n) : "") : words(toks, j, n);
        return {text: `كان هناك ${a.text}${rest ? "، " + rest : ""}`, rule: "pw + wn"};
      }
      const more = [];
      while (j < n) {
        const k = toks[j];
        if (k.upos === "PART" && word(k) === k.t) { j++; continue; }
        if (k.fn === "GEN_PART") { const ph = phrase(toks, j + 1, n); more.push("من " + ph.text); j = ph.next; continue; }
        more.push(word(k)); j++;
      }
      return {text: tidy([(a.fem ? "إنها" : "إنه"), a.text, ...more].join(" ")), rule: "A pw"};
    }

    function conj(k, person, tense, voice, stative) {
      const v = verbs[k.tla];
      if (!v) return null;
      let [past, pres, stem, ppast, ppres, imp] = v.split("|");
      if (voice === "masdar") { const m = v.split("|")[6]; return m || null; }
      if (voice === "imper") return imp ? imp + ({"2f": "ي", "2p": "وا"}[person] || "") : null;
      if (voice === "passive") {
        if (!ppast) return null;
        past = tense === "past" && stative && STATIVE_PASSIVE[k.tla] || ppast; pres = ppres || ppast; stem = "";
      }
      const st = stem || past, weak = /[ىا]$/.test(past);
      if (tense === "past") return {"1s": st + "تُ", "2m": st + "تَ", "2f": st + "تِ", "1p": st + "نا", "2p": st + "تم",
        "3m": past, "3f": weak ? past.slice(0, -1) + "ت" : past + "ت", "3p": weak ? past.slice(0, -1) + "وا" : past + "وا"}[person];
      const body = pres.slice(1);
      return {"1s": "أ" + body, "2m": "ت" + body, "2f": "ت" + body + "ين", "3m": pres, "3f": "ت" + body, "1p": "ن" + body,
        "2p": "ت" + body + "ون", "3p": pres + "ون"}[person];
    }
    const lastSuffix = t => { const p = t.split("."); return p.length > 1 && PERSON[p[p.length - 1]] ? p[p.length - 1] : null; };

    // The rest of a clause after its verb: subject and object as phrases, «اسمه X», the other words in order.
    function tail(toks, j, out) {
      while (j < toks.length) {
        const k = toks[j], nm = nameClause(toks, j);
        if (nm) { out.push("، " + nm); j += 2; continue; }
        if (k.upos === "PRON" && k.fn === "OBJ" && DEP_OBJ[k.t] && out.length) { out[out.length - 1] += DEP_OBJ[k.t]; j++; continue; }
        if (k.upos === "PART" && word(k) === k.t) { j++; continue; }
        if (["SUBJ", "OBJ", "POBJ"].includes(k.fn) && ["NOUN", "PROPN"].includes(k.upos)) {
          const ph = phrase(toks, j, toks.length); out.push(ph.text); j = ph.next; continue;
        }
        out.push(word(k)); j++;
      }
      return tidy(out.join(" "));
    }

    function verbal(toks) {
      const n = toks.length, intro = [];
      let i = 0, person = null, subj = null;
      for (; i < n && toks[i].upos === "PART"; i++) {
        const k = toks[i], bare = k.t.split(".")[0];
        if (INTRO[bare] === undefined) return null;
        if (INTRO[bare]) intro.push(INTRO[bare]);
        if (k.fn === "SUBJ" && lastSuffix(k.t)) person = PERSON[lastSuffix(k.t)];       // jw.f šm.w
      }
      if (i < n && toks[i].fn === "SUBJ" && ["NOUN", "PROPN"].includes(toks[i].upos)) {  // noun subject first
        subj = phrase(toks, i, n); i = subj.next; person = person || (subj.fem ? "3f" : "3m");
      }
      const v = toks[i];
      if (!v || v.upos !== "VERB" || !["VERB_HEAD", "PRED"].includes(v.fn)) return null;
      const stative = v.form === "الفعل التام القديم", jn = /\.jn(\.|$)/.test(v.t);
      if (v.form === "أمر") {
        const imp = v.heed ? word(v) : conj(v, "2m", null, "imper");
        if (!imp) return null;
        const self = toks[i + 1] && toks[i + 1].fn === "OBJ" && ["tw", "ṯw"].includes(toks[i + 1].t);   // jꜥ ṯw «… نفسك»
        return {text: tail(toks, i + (self ? 2 : 1), [...intro, imp, ...(self ? ["نفسك"] : [])]), rule: "أمر"};
      }
      const hasPassive = !!(verbs[v.tla] || "").split("|")[3];
      const voice = /\.tw(\.|$)/.test(v.t) || (stative && hasPassive && !ACTIVE_STATIVE.has(v.tla) && !/\.(kw|kj)$/.test(v.t)) ? "passive" : "active";
      let tense = "present";
      if (stative) {
        tense = "past";
        const st = STATIVE.find(([re]) => re.test(v.t));
        person = st ? st[1] : person || "3m";
      } else if (v.form === "sḏm.n.f" || /\.n(\.|$)/.test(v.t) || jn) {
        tense = "past";
        if (jn && !intro.includes("ثم")) intro.push("ثم");
      } else if (!["sḏm.f", "sḏm.ḫr.f", "sḏm.kꜣ.f"].includes(v.form)) return null;
      if (v.t.split(".")[0] === "wn" && (verbs[v.tla] || "").startsWith("كان")) tense = "past";   // narrative wn(n) = كان
      const suf = stative ? null : lastSuffix(v.t);
      if (suf && !(suf === "n" && v.t.split(".").length === 2)) person = PERSON[suf];   // pḥ.n.n «وصلنا», not sḏm.n
      const after = toks.slice(i + 1).find(k => k.fn === "SUBJ");                 // gm sw st: the subject after the object

  const MDC = {A: "ꜣ", i: "j", y: "y", a: "ꜥ", w: "w", b: "b", p: "p", f: "f", m: "m", n: "n", r: "r", h: "h", H: "ḥ",
    x: "ḫ", X: "ẖ", z: "s", s: "s", S: "š", q: "ḳ", k: "k", g: "g", t: "t", T: "ṯ", d: "d", D: "ḏ"};
  const UNI = {A: "𓄿", i: "𓇋", y: "𓏭", a: "𓂝", w: "𓅱", b: "𓃀", p: "𓊪", f: "𓆑", m: "𓅓", n: "𓈖", r: "𓂋", h: "𓉔", H: "𓎛",
    x: "𓐍", X: "𓄡", z: "𓊃", s: "𓋴", S: "𓈙", q: "𓈎", k: "𓎡", g: "𓎼", t: "𓏏", T: "𓍿", d: "𓂧", D: "𓆓"};
  const LATIN = {A: "ꜣ", a: "ꜥ", i: "j", H: "ḥ", x: "ḫ", X: "ẖ", S: "š", q: "ḳ", T: "ṯ", D: "ḏ", "=": "."};
  const normV = v => v.replace(/\([^)]*\)/g, "").replace(/[.=:\-\s]/g, "").replace(/ꞽ/g, "j");
  const BYVAL = new Map(), BYCODE = new Map(), CODEPRE = new Set();
  DATA.signs.forEach(([c, code, vals, rank]) => {
    if (c.codePointAt(0) > 0x1342F) return;               // the main block only: the newer signs have no font on most devices
    const lc = code.toLowerCase();
    if (!BYCODE.has(lc)) BYCODE.set(lc, c);
    for (let k = 1; k <= lc.length; k++) CODEPRE.add(lc.slice(0, k));
    vals.forEach(v => { const k = normV(v); if (!k) return; if (!BYVAL.has(k)) BYVAL.set(k, []); BYVAL.get(k).push([rank, c]); });
  });
  BYVAL.forEach(list => list.sort((a, b) => a[0] - b[0]));
  let buf = "", pick = 0, cands = [];
  const sound = b => Array.from(b).map(c => MDC[c] || c).join("");
  function candidatesFor(b) {
    const out = [], add = c => { if (c && !out.includes(c)) out.push(c); };
    if (/\d/.test(b)) { add(BYCODE.get(b.toLowerCase())); return out; }
    if (b.length === 1) add(UNI[b]);
    (BYVAL.get(sound(b)) || []).forEach(([, c]) => add(c));
    if (b.length <= 3) add(BYCODE.get(b.toLowerCase()));
    return out.slice(0, 9);
  }
  function drawIme() {
    const box = $("ime"); box.replaceChildren(); box.hidden = !buf;
    if (!buf) return;
    cands = candidatesFor(buf); pick = Math.min(pick, Math.max(cands.length - 1, 0));
    box.append(el("span", "buf", /\d/.test(buf) ? buf : sound(buf)));
    if (!cands.length) { box.append(el("span", "none", "—")); return; }
    cands.forEach((c, i) => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-selected", String(i === pick)); b.title = c;
      b.append(el("small", null, String(i + 1)), el("span", "hg", c));
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("click", () => commit(i)); box.append(b);
    });
  }
  function commit(i) { const c = cands[i]; buf = ""; pick = 0; drawIme(); if (c) ins(c); }
  const keyChar = e => {
    if (/^Key[A-Z]$/.test(e.code)) return e.shiftKey ? e.code[3] : e.code[3].toLowerCase();
    if (/^Digit\d$/.test(e.code) && !e.shiftKey) return e.code[5];
    if (e.code === "Equal" && !e.shiftKey) return "=";
    return null;
  };
  // one typed character, from a key press or (phone keyboards) from the text it inserts; true = handled
  function typed(ch) {
    if (mode === "t") { if (!/^[A-Za-z=]$/.test(ch)) return false; ins(LATIN[ch] || ch); return true; }
    if (/^\d$/.test(ch)) {
      if (buf && /^[A-Za-z]{1,2}\d*$/.test(buf) && CODEPRE.has((buf + ch).toLowerCase())) { buf += ch; pick = 0; drawIme(); return true; }
      if (buf && ch !== "0" && cands[+ch - 1]) { commit(+ch - 1); return true; }
      return false;
    }
    if (/^[A-Za-z]$/.test(ch)) { buf += ch; pick = 0; drawIme(); return true; }
    return false;
  }
  $("in").addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (mode === "h" && buf) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); commit(pick); return; }
      if (e.key === "Backspace") { e.preventDefault(); buf = buf.slice(0, -1); pick = 0; drawIme(); return; }
      if (e.key === "Escape") { e.preventDefault(); buf = ""; drawIme(); return; }
      if (e.key === "Tab") { e.preventDefault(); pick = cands.length ? (pick + (e.shiftKey ? cands.length - 1 : 1)) % cands.length : 0; drawIme(); return; }
    }
    const ch = keyChar(e);
    if (ch && typed(ch)) e.preventDefault();
  });
  $("in").addEventListener("beforeinput", e => {          // phone keyboards send no key code
    if (e.inputType === "insertText" && e.data && e.data.length === 1 && typed(e.data)) e.preventDefault();
  });
  $("in").addEventListener("blur", () => { if (buf) { buf = ""; drawIme(); } });
  function drawKeys() {
    const t = $("keytable"); t.replaceChildren();
    Object.keys(UNI).forEach(k => { const d = el("div"); d.append(el("kbd", null, k), el("span", "tr", MDC[k]), el("span", "hg", UNI[k])); t.append(d); });
    [["مسافة / Enter", "أول علامة"], ["1–9", "علامة تانية"], ["Tab", "اللي بعدها"], ["Esc", "إلغاء"], ["A1 · G17 · Aa1", "رقم جاردنر"],
     ["nfr · mn · Ra", "علامة بنطقها"], ["=", ". الضمير المتصل"]].forEach(([k, v]) => {
      const d = el("div", "wide"); d.append(el("kbd", null, k), document.createTextNode(v)); t.append(d); });
  }
  drawKeys();
  $("keys").addEventListener("click", () => { const t = $("keytable"); t.hidden = !t.hidden; $("keys").setAttribute("aria-expanded", String(!t.hidden)); });

  $("m-h").addEventListener("click", () => setMode("h"));
  $("m-t").addEventListener("click", () => setMode("t"));
  $("l-en").addEventListener("click", () => { lang = 0; store("mu-lang", "en"); show(); });
  $("l-ar").addEventListener("click", () => { lang = 1; store("mu-lang", "ar"); show(); });
  $("allen").addEventListener("change", () => { store("mu-allen", $("allen").checked ? "1" : "0"); show(); });
  $("go").addEventListener("click", () => run());
  $("optbtn").addEventListener("click", () => { const open = !$("opts").classList.toggle("open") ? false : true;
    $("optbtn").setAttribute("aria-expanded", String(open)); });
  $("in").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
  $("more").addEventListener("click", () => { const p = $("pal"); p.classList.toggle("open"); $("more").textContent = p.classList.contains("open") ? "علامات أقل" : "كل العلامات"; });
  $("del").addEventListener("click", () => { const a = Array.from($("in").value); a.pop(); $("in").value = a.join(""); });
  $("sp").addEventListener("click", () => ins(" "));
  $("clr").addEventListener("click", () => { $("in").value = ""; last = null; show(); });
  setMode(mode);
  drawHist();

  (async function boot() {
    try {
      const [lex, idx] = await Promise.all([getJSON("lexicon_slim.json"), getJSON("spelling_index.json")]);
      LEX = lex; live = new IRAB.Live(lex, DATA.closed, DATA.seed);
      translate = TR.makeTranslator(DATA.ar, DATA.base, DATA.verbs, DATA.plural);
      reader = new HIERO.Reader(idx, DATA.sound, id => { const e = lex.lemmas[id]; return e && e.upos ? Object.keys(e.upos).sort((a, b) => e.upos[b] - e.upos[a])[0] : null; }, DATA.dets);
      $("go").disabled = false; status("");
      run(true);
      getJSON("word_info.json").then(x => { INFO = x; if (last && !document.querySelector(".wp")) show(); }).catch(() => { INFO = {sp: {}, ar: {}, gram: {}}; });
      // the English translator's meanings (data/words_en): until they come, English is each word's first sense
      getJSON("en.json").then(x => { translateEn = TREN.makeTranslatorEn(TREN.tablesEn(x.en, x.extra), x.extra); if (last && !lang && !document.querySelector(".wp")) show(); }).catch(() => { /* senses word by word */ });
      // the word-context model (jt «father» / «barley» from the words around it): the sentence is read again when it comes
      getJSON("context_slim.json").then(x => { live.engine.context = x; if (last && !document.querySelector(".wp")) run(true); }).catch(() => { /* works without it */ });
      try { caches.keys().then(ks => ks.forEach(k => { if (k.startsWith("mueirib-") && k !== CACHE) caches.delete(k); })).catch(() => {}); } catch (e) { /* no cache */ }
    } catch (e) { $("out").replaceChildren(); status("القاموس ما اتحمّلش، اعمل تحديث للصفحة (" + String(e && e.message || e).slice(0, 80) + ")", true); }
  })();
})();
</script>
