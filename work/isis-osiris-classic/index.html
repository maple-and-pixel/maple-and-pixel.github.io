<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إيزيس وأوزوريس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Egyptian+Hieroglyphs&family=Gentium+Book+Plus:ital@1&display=swap">
<style>
/* Layout: one screen. A lamp-lit burial chamber (carved wall, stone floor) holds the two statues;
   controls float over it; the parts tour opens as a bottom sheet. Single dark world. */
:root {
  color-scheme: dark;
  --night: #0b0907;        /* the dark sheet and the story mode */
  --gallery: #d3c8b6;      /* pale limestone gallery */
  --ink: #2a2016;
  --ink-2: #5b4e3e;
  --bronze: #8a5d1c;
  --stone: #1a1612;
  --line: #3a3128;
  --papyrus: #efe7d6;
  --muted: #b3a892;
  --gold: #d4ab5f;
  --f-display: "Reem Kufi", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  --f-glyph: "Noto Sans Egyptian Hieroglyphs", "Segoe UI Historic", serif;
  --f-tl: "Gentium Book Plus", "Times New Roman", serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100% }
body { background: var(--night); color: var(--papyrus); font-family: var(--f-body); -webkit-tap-highlight-color: transparent; overflow: hidden }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }

.stage { position: relative; height: 100%; min-height: 480px; overflow: hidden; background: var(--gallery) }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 45%, transparent 50%, #2a201659 100%) }

.top {
  position: absolute; inset-inline: 0; top: 0; padding: 16px; display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; transition: opacity .8s;
}
.stage.show .top { opacity: .2 }
.stage.touring .top { opacity: 0; pointer-events: none }
.stage.touring .top * { pointer-events: none }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1.15; color: var(--ink); text-shadow: 0 1px 12px #fff8ec }
.sub { margin: .2rem 0 0; color: var(--ink-2); font-size: .9rem; max-width: 22rem; text-shadow: 0 1px 8px #fff8ec }
.stage.show h1 { color: var(--papyrus); text-shadow: none }
.views { display: flex; gap: 6px; pointer-events: auto }
.chip {
  border: 1px solid #2a201633; background: #fffaf0a6; color: var(--ink);
  padding: .25rem .85rem; border-radius: 999px; font-size: .9rem; cursor: pointer; line-height: 1.7; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--bronze); color: var(--bronze); background: #fffaf0e0 }
.sheet .chip { border-color: var(--line); background: none; color: var(--papyrus) }
.sheet .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold) }

.bottom {
  position: absolute; inset-inline: 0; bottom: 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; pointer-events: none;
}
.listen {
  pointer-events: auto; display: inline-flex; align-items: center; gap: .6rem; cursor: pointer;
  border: 0; border-radius: 999px; background: var(--gold); color: #1c1407;
  padding: .55rem 1.3rem .55rem 1rem; font-family: var(--f-display); font-size: 1.1rem; box-shadow: 0 8px 30px #000a;
}
.listen svg { width: 1rem; height: 1rem }
.bottom .chip { pointer-events: auto; padding: .5rem 1.05rem; font-size: 1rem; font-family: var(--f-display) }
.stage.show .bottom .chip { opacity: 0; pointer-events: none }

.loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none }
.loading { color: var(--ink) }
.loading span { font-family: var(--f-glyph); font-size: 2.4rem; color: var(--gold); animation: breathe 1.6s ease-in-out infinite }
@keyframes breathe { 50% { opacity: .3 } }
.caption {
  position: absolute; inset-inline: 16px; bottom: 92px; text-align: center; pointer-events: none;
  font-family: var(--f-display); font-size: clamp(1.1rem, 4.2vw, 1.5rem); line-height: 1.7;
  text-shadow: 0 2px 14px #000, 0 0 3px #000; opacity: 0; transition: opacity .6s; text-wrap: balance;
}
.caption.on { opacity: 1 }

/* callout on the statue: a ring on the spot, a leader line, a label */
.callout { position: absolute; inset: 0; pointer-events: none }
.callout svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible }
.callout line { stroke: var(--gold); stroke-width: 1.4 }
.ring { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid var(--gold); border-radius: 50%; animation: pulse 1.8s ease-out infinite }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 #d4ab5f88 } 100% { box-shadow: 0 0 0 16px #d4ab5f00 } }
.tag {
  position: absolute; transform: translate(-50%, -100%); font-family: var(--f-display); font-size: .95rem; white-space: nowrap;
  background: var(--gold); color: #1c1407; padding: .1rem .7rem; border-radius: 6px;
}

/* parts sheet */
.sheet {
  position: absolute; inset-inline: 0; bottom: 0; max-width: 560px; margin-inline: auto;
  background: color-mix(in srgb, var(--stone) 95%, transparent); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0; padding: .7rem 0 calc(1rem + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -20px 50px #000a;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 8px }
.sheet-head .who { display: flex; gap: 6px }
.x { background: none; border: 0; color: var(--muted); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: .2rem .4rem }
.partlist { display: flex; gap: 6px; overflow-x: auto; padding: .7rem 16px .5rem; scrollbar-width: none }
.partlist::-webkit-scrollbar { display: none }
.part { flex: none; border: 1px solid var(--line); background: none; border-radius: 10px; padding: .3rem .8rem; cursor: pointer; font-size: .92rem }
.part[aria-pressed="true"] { background: var(--gold); color: #1c1407; border-color: var(--gold) }
.explain { padding: .2rem 16px 0; min-height: 7.5rem }
.explain h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 1.2rem }
.explain p { margin: .3rem 0 0; font-size: 1rem; line-height: 1.85 }
.reading { display: flex; flex-wrap: wrap; gap: 8px; margin-top: .6rem }
.word { border: 1px solid var(--line); border-radius: 10px; padding: .35rem .7rem; background: #0b090766; min-width: 0 }
.word .g { font-family: var(--f-glyph); color: var(--gold); font-size: 1.6rem; display: block; line-height: 1.3 }
.word .tl { font-family: var(--f-tl); font-style: italic; color: var(--muted); font-size: .9rem; direction: ltr; unicode-bidi: isolate }
.word b { font-weight: 600; font-size: .95rem; display: block }
.rl { flex-basis: 100%; color: var(--muted); font-size: .85rem }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head><body>

<main class="stage" id="stage" dir="rtl" lang="ar" aria-label="إيزيس وأوزوريس في عرض ثلاثي الأبعاد">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="callout" id="callout" hidden>
    <svg aria-hidden="true"><line id="lead"/></svg>
    <div class="ring" id="ring"></div>
    <div class="tag" id="tag"></div>
  </div>
  <div class="loading" id="loading"><span aria-hidden="true">𓋹</span></div>
  <div class="caption" id="caption" aria-live="polite"></div>

  <div class="top">
    <div>
      <h1>إيزيس وأوزوريس</h1>
      <p class="sub">حكاية الوفاء والبعث، منذ أكثر من ٤٠٠٠&nbsp;عام</p>
    </div>
    <div class="views" role="group" aria-label="اختر التمثال">
      <button class="chip" data-view="both" aria-pressed="true">الاثنان</button>
      <button class="chip" data-view="osiris" aria-pressed="false">أوزوريس</button>
      <button class="chip" data-view="isis" aria-pressed="false">إيزيس</button>
    </div>
  </div>

  <div class="bottom" id="bottom">
    <button class="listen" id="listen" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path id="ico" fill="currentColor" d="M4 2.5v11l9.5-5.5z"/></svg>
      <span id="listenLabel">استمع للحكاية</span>
    </button>
    <button class="chip" id="openParts">أجزاء التمثال</button>
  </div>

  <section class="sheet" id="sheet" hidden aria-label="أجزاء التمثال">
    <div class="sheet-head">
      <div class="who" role="group" aria-label="التمثال">
        <button class="chip" data-who="osiris" aria-pressed="true">أوزوريس</button>
        <button class="chip" data-who="isis" aria-pressed="false">إيزيس</button>
      </div>
      <button class="x" id="closeParts" aria-label="إغلاق">×</button>
    </div>
    <div class="partlist" id="partlist" role="group" aria-label="الأجزاء"></div>
    <div class="explain" aria-live="polite">
      <h3 id="pTitle"></h3>
      <p id="pBody"></p>
      <div class="reading" id="pRead"></div>
    </div>
  </section>
  <audio id="narr" preload="auto" src="narration.mp3?v=9"></audio>
</main>

    sh.uniforms.uSweep = sweepU;
    sh.fragmentShader = 'uniform float uSweep;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       float band = smoothstep(.22, 0., abs(fract(vEmissiveMapUv.x) - uSweep));
       totalEmissiveRadiance *= .35 + 1.6 * band;`);
  };
  // a round chamber all around the statues, so they can be seen from every side
  wallTex.wrapS = glow.wrapS = THREE.RepeatWrapping; wallTex.repeat.x = glow.repeat.x = 5;
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(24, 24, 18, 96, 1, true), wallMat);
  wallMat.side = THREE.BackSide; wall.position.y = 9; wall.receiveShadow = true; scene.add(wall);
  chamberParts.wall = wallMat;

  // floor: big limestone slabs
  const fc = document.createElement('canvas'); fc.width = fc.height = 1024; const f = fc.getContext('2d');
  f.fillStyle = '#9a8e7d'; f.fillRect(0, 0, 1024, 1024); noise(f, 1024, 1024, 12);
  f.strokeStyle = '#857a6a'; f.lineWidth = 3;
  for (let i = 0; i <= 1024; i += 256) { f.beginPath(); f.moveTo(i, 0); f.lineTo(i, 1024); f.stroke() }
  for (let j = 0; j <= 1024; j += 256) { f.beginPath(); f.moveTo(0, j); f.lineTo(1024, j); f.stroke() }
  const floorTex = new THREE.CanvasTexture(fc); floorTex.colorSpace = THREE.SRGBColorSpace;
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(6, 6); floorTex.anisotropy = 4;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(24, 96), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .7 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor); chamberParts.floor = floor.material;
  renderer.shadowMap.needsUpdate = true; dirty = true;
}
const sweepU = { value: -1 }, chamberParts = {};
chamber();

/* ---------------- light beams for the story, and a narrow light for the parts tour ---------------- */
const beams = {};
function makeBeam(name) {
  const spot = new THREE.SpotLight(0xffe2b0, 0, 0, .3, .55, 1.2); scene.add(spot, spot.target);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uColor: { value: new THREE.Color(0xffe2b0) }, uOpacity: { value: 0 } },
    vertexShader: `varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ vH = uv.y; vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ float a = uOpacity * pow(vH, 1.4) * pow(abs(dot(vN, vV)), 1.6); gl_FragColor = vec4(uColor * a, a); }`,
  });
  const cone = new THREE.Mesh(new THREE.BufferGeometry(), mat); cone.visible = false; scene.add(cone);
  beams[name] = { spot, cone, level: 0 };
}
makeBeam('osiris'); makeBeam('isis');
function placeBeam(b, s) {
  const top = new THREE.Vector3(s.center.x, s.box.max.y + s.size.y * .75, s.center.z + 1.2), aim = new THREE.Vector3(s.center.x, s.box.min.y + s.size.y * .45, s.center.z);
  b.spot.position.copy(top); b.spot.target.position.copy(aim);
  const len = top.distanceTo(new THREE.Vector3(aim.x, 0, aim.z));
  b.cone.geometry = new THREE.ConeGeometry(Math.tan(b.spot.angle) * len * .9, len, 40, 1, true).translate(0, -len / 2, 0);
  b.cone.position.copy(top); b.cone.lookAt(aim.x, 0, aim.z); b.cone.rotateX(-Math.PI / 2);
}
const focusSpot = new THREE.SpotLight(0xfff0d6, 0, 0, .16, .7, 1); scene.add(focusSpot, focusSpot.target);

/* ---------------- statues ---------------- */
const loader = new GLTFLoader();   // plain GLBs: no decoder worker or WebAssembly, so every phone can open them
const statues = {}, group = new THREE.Group(); scene.add(group);
function isisStone(hasAO) {   // Osiris' measured stone tone, with pale dust settled in the carving
  const mtl = new THREE.MeshPhysicalMaterial({ color: 0x1b1e1b, roughness: .45, metalness: 0, envMapIntensity: 1,
    clearcoat: .45, clearcoatRoughness: .28, vertexColors: hasAO });
  if (hasAO) mtl.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>',
      `diffuseColor.rgb = mix(vec3(.075,.072,.066), diffuseColor.rgb, smoothstep(.3, .8, vColor.r));`);
  };
  return mtl;
}
function prepare(name, gltf) {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    if (name === 'isis') o.material = isisStone(!!o.geometry.attributes.color);
    else {   // keep Tripo's stone texture, add the same polish and a faint green to the black
      const old = o.material;
      o.material = new THREE.MeshPhysicalMaterial({ map: old.map, color: 0xeef7ee, roughness: .42, metalness: 0, envMapIntensity: 1.05,
        clearcoat: .45, clearcoatRoughness: .28 });
      old.dispose();
    }
  });
  group.add(gltf.scene); statues[name] = { root: gltf.scene };
}
const MODELS = /*__MODELS__*/{}, VERSION = 9;
const load = (n) => new Promise((ok, no) => {
  const done = g => { prepare(n, g); ok() };
  if (!MODELS[n]) return loader.load(`${n}.glb?v=${VERSION}`, done, undefined, no);   // ?v= so phones don't keep an old copy
  loader.parse(Uint8Array.from(atob(MODELS[n]), c => c.charCodeAt(0)).buffer, '', done, no);
});

const views = {}, perf = { t0: performance.now() }, PLINTH = 1.5;
Promise.all([load('osiris'), load('isis')]).then(() => {
  group.updateMatrixWorld(true);
  const ob = new THREE.Box3().setFromObject(statues.osiris.root);
  group.scale.setScalar(7.95 / (ob.max.y - ob.min.y)); group.updateMatrixWorld(true);
  group.position.y -= new THREE.Box3().setFromObject(group).min.y - PLINTH; group.updateMatrixWorld(true);
  // one stepped limestone dais that the pair share, like a temple platform
  const plinthMat = chamberParts.plinth = new THREE.MeshStandardMaterial({ color: 0xcfc5b4, roughness: .8 });
  const pair = new THREE.Box3().setFromObject(group), pc = pair.getCenter(new THREE.Vector3()), ps = pair.getSize(new THREE.Vector3());
  const STEP = PLINTH * .3;
  for (const [w, d, y0, y1] of [[ps.x + 1.9, ps.z + 1.9, 0, STEP], [ps.x + 1.0, ps.z + 1.0, STEP, PLINTH]]) {
    const tier = new THREE.Mesh(new THREE.BoxGeometry(w, y1 - y0, d), plinthMat);
    tier.position.set(pc.x, (y0 + y1) / 2, pc.z); tier.castShadow = tier.receiveShadow = true; scene.add(tier);
  }
  for (const n of ['osiris', 'isis']) {
    const b = new THREE.Box3().setFromObject(statues[n].root);
    Object.assign(statues[n], { box: b, center: b.getCenter(new THREE.Vector3()), size: b.getSize(new THREE.Vector3()) });
    statues[n].meshes = []; statues[n].root.traverse(o => o.isMesh && statues[n].meshes.push(o));
    placeBeam(beams[n], statues[n]); light(statues[n]);
  }
  views.both = { box: statues.osiris.box.clone().union(statues.isis.box), dir: new THREE.Vector3(.16, .08, 1) };
  views.both.box.min.y -= PLINTH * .6;   // keep a little of the plinths in the frame
  views.osiris = { box: statues.osiris.box, dir: new THREE.Vector3(-.3, .08, 1) };
  views.isis = { box: statues.isis.box, dir: new THREE.Vector3(.3, .08, 1) };
  bounds = views.both.box.clone().expandByScalar(.4);
  const v = frame(views.both); camera.position.copy(v.pos); controls.target.copy(v.target);
  document.getElementById('loading').hidden = true; renderer.shadowMap.needsUpdate = true; dirty = true;
  perf.ready = performance.now() - perf.t0;
}).catch(err => { failLoad(); console.error(err) });
function failLoad() {
  const el = document.getElementById('loading');
  if (el.hidden) return;
  el.innerHTML = '<p style="text-align:center;padding:0 24px">تعذّر عرض التمثالين على هذا الجهاز.<br>حدّث الصفحة، أو افتحها من متصفح كروم أو سفاري.</p>';
}
setTimeout(failLoad, 45000);   // never leave the visitor watching the ankh forever

/* ---------------- camera ---------------- */
let tween = null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(view, extra = 1) {
  const size = view.box.getSize(new THREE.Vector3()), c = view.box.getCenter(new THREE.Vector3());
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const d = Math.max(size.y / 2 / Math.tan(vf / 2), Math.max(size.x, size.z * .5) / 2 / Math.tan(hf / 2));
  return { target: c.clone(), pos: c.clone().addScaledVector(view.dir.clone().normalize(), d * (camera.aspect < .8 ? 1.28 : 1.12) * extra + size.z * .5) };
}
function flyTo(v, ms = 1100) {
  if (v.box) v = frame(v);
  tween = { from: { pos: camera.position.clone(), target: controls.target.clone() }, to: v, t0: performance.now(), ms: reduce ? 1 : ms };
}
const viewChips = document.querySelectorAll('.chip[data-view]');
const pressView = (name) => viewChips.forEach(x => x.setAttribute('aria-pressed', x.dataset.view === name));
viewChips.forEach(b => b.addEventListener('click', () => {
  pressView(b.dataset.view);
  if (partsOpen && b.dataset.view !== 'both') openParts(b.dataset.view);
  else if (views[b.dataset.view]) flyTo(views[b.dataset.view]);
}));

/* ---------------- parts tour ---------------- */
const sheet = document.getElementById('sheet'), bottom = document.getElementById('bottom');
const partlist = document.getElementById('partlist'), callout = document.getElementById('callout');
const ray = new THREE.Raycaster();
let partsOpen = false, who = 'osiris', current = null;
function anchor(n, f) {   // where a part sits on the statue's surface, found by casting a ray at it from the front
  const s = statues[n], x = s.center.x + f.u * s.size.x, y = s.box.min.y + f.v * s.size.y;
  ray.set(new THREE.Vector3(x, y, s.box.max.z + 5), new THREE.Vector3(0, 0, -1));
  const hit = ray.intersectObjects(s.meshes, false)[0];
  const p = hit ? hit.point.clone() : new THREE.Vector3(x, y, s.box.max.z);
  const nrm = hit?.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 0, 1);
  return { p, nrm };
}
function openParts(n) {
  if (!statues[n]) return;
  partsOpen = true; who = n; sheet.hidden = false; bottom.hidden = true; pressView(n); stage.classList.add('touring');
  document.querySelectorAll('[data-who]').forEach(b => b.setAttribute('aria-pressed', b.dataset.who === n));
  partlist.innerHTML = '';
  PARTS[n].forEach((f, i) => {
    const b = document.createElement('button'); b.className = 'part'; b.textContent = f.t; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => showPart(i)); partlist.appendChild(b);
  });
  showPart(0);
}
function closeParts() {
  partsOpen = false; sheet.hidden = true; bottom.hidden = false; callout.hidden = true; current = null; stage.classList.remove('touring');
  pressView('both'); flyTo(views.both); dirty = true;
}
function showPart(i) {
  const f = PARTS[who][i];
  [...partlist.children].forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  partlist.children[i].scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  document.getElementById('pTitle').textContent = f.title;
  document.getElementById('pBody').textContent = f.p;
  document.getElementById('pRead').innerHTML = (f.readLabel ? `<div class="rl">${f.readLabel}</div>` : '') + (f.read || []).map(([g, tl, m]) =>
    `<div class="word"><span class="g" aria-hidden="true">${g}</span><b>${m}</b><span class="tl">${tl}</span></div>`).join('');
  const { p, nrm } = anchor(who, f);
  current = { f, p, t0: performance.now() };
  // fly close, keeping the part in the upper half of the screen (the sheet covers the lower part)
  const dir = nrm.clone().setY(0); if (dir.lengthSq() < .1) dir.set(0, 0, 1); dir.normalize().add(new THREE.Vector3(who === 'osiris' ? -.25 : .25, .12, 0)).normalize();
  const dist = f.sweep ? 8 : 7.2;
  const target = p.clone().add(new THREE.Vector3(0, -dist * .17, 0));
  flyTo({ target, pos: target.clone().addScaledVector(dir, dist) }, 1200);
  focusSpot.position.copy(p.clone().addScaledVector(dir, 6).add(new THREE.Vector3(0, 3, 0)));
  focusSpot.target.position.copy(p);
  callout.hidden = false; document.getElementById('tag').textContent = f.t;
}
document.getElementById('openParts').addEventListener('click', () => openParts(document.querySelector('.chip[data-view][aria-pressed="true"]')?.dataset.view === 'isis' ? 'isis' : 'osiris'));
document.getElementById('closeParts').addEventListener('click', closeParts);
document.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => openParts(b.dataset.who)));

/* ---------------- the story: hall goes dark, beams on the statues, the carved wall glows ---------------- */
const audio = document.getElementById('narr');
let hasAudio = false;
const RECORDING = 46.1;   // s, used until the phone has loaded the file
audio.addEventListener('loadedmetadata', () => { hasAudio = isFinite(audio.duration) && audio.duration > 0 });
audio.addEventListener('playing', () => { hasAudio = true; if (show) show.dur = (isFinite(audio.duration) ? audio.duration : RECORDING) * 1000 });
const listen = document.getElementById('listen'), caption = document.getElementById('caption'), ico = document.getElementById('ico');
let show = null, lastLine = -1;
listen.addEventListener('click', () => show ? endShow() : startShow());
function startShow() {
  show = { t0: performance.now(), dur: (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : RECORDING) * 1000 };
  try { audio.currentTime = 0 } catch (e) {}
  audio.play().catch(() => {});   // iPhone/Android only fetch the recording on this tap
  listen.setAttribute('aria-pressed', 'true'); document.getElementById('listenLabel').textContent = 'إيقاف';
  ico.setAttribute('d', 'M4 3h3v10H4zM9 3h3v10H9z');
  stage.classList.add('show'); pressView('both');
  if (views.both) { show.home = frame(views.both, 1.1); show.from = { pos: camera.position.clone(), target: controls.target.clone() } }
  tween = null;
}
function endShow() {
  show = null; audio.pause();
  listen.setAttribute('aria-pressed', 'false'); document.getElementById('listenLabel').textContent = 'استمع للحكاية';
  ico.setAttribute('d', 'M4 2.5v11l9.5-5.5z');
  stage.classList.remove('show'); caption.classList.remove('on'); lastLine = -1;
  if (views.both) flyTo(views.both, 1600);   // always come back to the opening view
}
audio.addEventListener('ended', () => show && endShow());

/* ---------------- loop ---------------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < .8 ? 38 : 30;
  camera.updateProjectionMatrix(); dirty = true;
}
new ResizeObserver(resize).observe(stage); resize();

const tmp = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), lead = document.getElementById('lead');
const ring = document.getElementById('ring'), tag = document.getElementById('tag');
let dim = 0, focusLv = 0, last = performance.now();
perf.frames = 0; perf.worst = 0;
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(.05, (now - last) / 1000), frameMs = now - last; last = now;
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.ms), e = ease(k);
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e); controls.target.lerpVectors(tween.from.target, tween.to.target, e);
    if (k >= 1) tween = null; dirty = true;
  }
  let goal = 0, focus = 'both';
  if (show) {
    const el = now - show.t0;
    // follow the recording's own clock when there is one, so words, captions and light stay together
    const tSec = !audio.paused && audio.currentTime > 0 ? audio.currentTime : el / 1000;
    const k = tSec * 1000 / show.dur;
    if (el >= show.dur + 1500 && audio.paused) endShow();   // also covers a recording the phone refused to play
    else {
      goal = 1;
      let line = 0;
      for (let i = 0; i < CUES.length; i++) if (tSec >= CUES[i]) line = i;
      focus = NARRATION[line][1];
      if (line !== lastLine) {
        lastLine = line; caption.classList.remove('on');
        setTimeout(() => { if (show) { caption.textContent = NARRATION[line][0]; caption.classList.add('on') } }, 200);
      }
      sweepU.value = -.3 + ((el / 9000) % 1) * 1.6;
      if (show.home) {
        // swing gently to one side and back over the whole story, landing centred on the last line
        const swing = reduce ? 0 : .35 * Math.sin(Math.min(k, 1) * Math.PI * 2) * Math.sin(Math.min(k, 1) * Math.PI);
        const pos = show.home.pos.clone().sub(show.home.target).applyAxisAngle(up, swing).add(show.home.target);
        const e = ease(Math.min(1, el / 2200));   // first glide from wherever the viewer left the camera
        camera.position.lerpVectors(show.from.pos, pos, e); controls.target.lerpVectors(show.from.target, show.home.target, e);
      }
      dirty = true;
    }
  }
  const prev = dim + focusLv;
  dim += (goal - dim) * Math.min(1, dt * 1.6);
  focusLv += ((partsOpen && !show ? 1 : 0) - focusLv) * Math.min(1, dt * 2.5);
  if (Math.abs(dim + focusLv - prev) > 1e-4) dirty = true;
  const lower = Math.max(.9 * dim, .45 * focusLv);
  hemi.intensity = BASE.hemi * (1 - lower); fill.intensity = BASE.fill * (1 - lower);
  for (const l of museum) {
    const r = l.userData.role, cut = r === 'wash' ? Math.max(.95 * dim, .5 * focusLv) : r === 'key' ? Math.max(.65 * dim, .35 * focusLv) : .3 * dim;
    l.intensity = l.userData.power * (1 - cut);
  }
  scene.background.copy(GALLERY).lerp(NIGHT, dim);
  if (chamberParts.wall) {   // for the story the room itself goes dark, so only the statues and the gold frieze stay lit
    chamberParts.wall.emissiveIntensity = .9 * dim; chamberParts.wall.color.setScalar(1 - .88 * dim);
    chamberParts.floor.color.setScalar(1 - .8 * dim);
  }
  if (chamberParts.plinth) chamberParts.plinth.color.setHex(0xcfc5b4).multiplyScalar(1 - .7 * dim);
  for (const n of ['osiris', 'isis']) {
    const b = beams[n], want = dim * (focus === 'both' ? 1 : focus === n ? 1.25 : .45);
    b.level += (want - b.level) * Math.min(1, dt * 2);
    b.spot.intensity = 260 * b.level; b.cone.material.uniforms.uOpacity.value = .13 * b.level; b.cone.visible = b.level > .01;
  }
  focusSpot.intensity = 120 * focusLv;
  if (current?.f.sweep) {   // the light reads along the inscription, left to right and back
    const s = statues[who], ph = Math.sin((now - current.t0) / 1400);
    focusSpot.target.position.set(s.center.x + ph * s.size.x * .32, current.p.y, current.p.z); dirty = true;
  }

  if (controls.update()) dirty = true;
  if (bounds && !tween && !show && !bounds.containsPoint(controls.target)) {
    const t = controls.target.clone().clamp(bounds.min, bounds.max), d = t.sub(controls.target);
    controls.target.add(d); camera.position.add(d); dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
  perf.frames++; if (perf.frames > 30) perf.worst = Math.max(perf.worst, frameMs);

  if (current && partsOpen) {
    const w = stage.clientWidth, h = stage.clientHeight;
    tmp.copy(current.p).project(camera);
    const x = (tmp.x * .5 + .5) * w, y = (-tmp.y * .5 + .5) * h;
    const side = x > w / 2 ? -1 : 1, lx = Math.min(w - 70, Math.max(70, x + side * 46)), ly = Math.max(44, y - 58);
    ring.style.left = `${x}px`; ring.style.top = `${y}px`;
    tag.style.left = `${lx}px`; tag.style.top = `${ly}px`;
    lead.setAttribute('x1', x); lead.setAttribute('y1', y - 11); lead.setAttribute('x2', lx); lead.setAttribute('y2', ly);
  }
});
window.__perf = perf;
</script>
