<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحت أشعة آتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* One screen. Both casts hang on one wall in the blue studio. Two ideas of its own:
   the SKY (corner): drag the sun along its arc and the light rakes across the carving;
   the RAYS: tap a spot and a ray of light travels from the Aten disk down to it, then its card opens. */
:root {
  color-scheme: light;
  --bg: #748ba1;
  --ink: #241d14;
  --ink-2: #6a5b47;
  --sheet: #f5efe3;
  --sheet-2: #e9dfcc;
  --gold: #d9a441;         /* Aten gold */
  --gold-deep: #a8731c;
  --night: #16202b;
  --f-display: "Reem Kufi", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  --panel-h: min(38vh, 290px);
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); -webkit-tap-highlight-color: transparent; overflow: hidden }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }

.stage { position: relative; height: 100%; min-height: 520px; overflow: hidden; background: var(--bg) }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 90% at 50% 35%, transparent 55%, #0d162055 100%) }

.top { position: absolute; inset-inline: 0; top: 0; padding: 14px 16px; pointer-events: none; padding-inline-end: 120px }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 6vw, 2.2rem); line-height: 1.15; color: #fbf7f0; text-shadow: 0 1px 14px #0005 }
.sub { margin: .25rem 0 0; color: #f1ebe2; font-size: .88rem; text-shadow: 0 1px 10px #0006 }
/* the two pieces of the hall */
.pieces { display: inline-flex; gap: 4px; margin-top: .6rem; padding: 4px; border-radius: 999px; background: #0d1620a6; pointer-events: auto }
.pieces button { border: 0; cursor: pointer; border-radius: 999px; height: 36px; padding: 0 16px; font-family: var(--f-display); font-size: .92rem; background: transparent; color: #f4f1ea }
.pieces button[aria-selected="true"] { background: var(--gold); color: #2a1d08 }
.go { margin-top: .8rem; border: 0; cursor: pointer; border-radius: 999px; height: 42px; padding: 0 18px; font-family: var(--f-display); font-size: .95rem; background: var(--gold); color: #2a1d08 }

/* the sky: a half-dial; the sun rides it and the light follows */
.sky { position: absolute; top: 12px; inset-inline-end: 10px; width: 108px; text-align: center; touch-action: none; user-select: none }
.sky svg { width: 108px; height: 62px; display: block; overflow: visible; cursor: grab }
.sky .arc { fill: none; stroke: #ffffff55; stroke-width: 1.4; stroke-dasharray: 2 4 }
.sky .ground { stroke: #ffffff40; stroke-width: 1 }
.sky .sun { fill: var(--gold); stroke: #fff6dd; stroke-width: 1.5; filter: drop-shadow(0 0 6px #ffd27a) }
.sky .beam { stroke: #ffe3a1; stroke-width: 1; opacity: .7 }
.sky .lbl { font-family: var(--f-display); font-size: .7rem; color: #f4f1ea; text-shadow: 0 1px 8px #0008; margin-top: 2px }
.sky.hint .sun { animation: nudge 2.4s ease-in-out 3 }
@keyframes nudge { 50% { transform: translateX(-10px) } }

/* hotspots: small suns on the stone, only while the rays are shown */
.spots { position: absolute; inset: 0; pointer-events: none }
.spot {
  position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; pointer-events: auto;
  background: radial-gradient(circle, #fff3cf 0 22%, #d9a441cc 24% 46%, transparent 48%); transition: transform .25s, opacity .3s;
}
.spot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1.5px solid #ffe3a1aa; animation: ping 2.4s ease-out infinite }
.spot.on { transform: scale(1.35) }
.spot.on::after { border-color: #fff }
.spot.away { opacity: 0; pointer-events: none }
@keyframes ping { from { transform: scale(.6); opacity: 1 } to { transform: scale(1.5); opacity: 0 } }

/* the card */
.panel { position: absolute; inset-inline: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none }
.sheet {
  position: relative; pointer-events: auto; width: min(100%, 540px); height: var(--panel-h); display: flex; flex-direction: column;
  background: linear-gradient(170deg, var(--sheet), var(--sheet-2)); border-radius: 22px;
  box-shadow: 0 14px 40px #10192a66, inset 0 0 0 1px #ffffffaa;
}
.sheet::before { content: ""; position: absolute; top: 0; inset-inline: 22px; height: 3px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent) }
.body { flex: 1; overflow: auto; padding: 16px 18px 6px; padding-inline-end: 48px; scrollbar-width: thin }
.kicker { font-family: var(--f-display); color: var(--gold-deep); font-size: .82rem }
.sheet h2 { margin: .1rem 0 .45rem; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.35 }
.sheet p { margin: 0; font-size: 1.02rem; line-height: 1.9 }
.src { display: block; margin-top: .6rem; font-size: .78rem; color: var(--ink-2) }
.nav { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px }
.nav button { border: 0; cursor: pointer; border-radius: 999px; height: 40px; min-width: 40px; padding: 0 14px; background: #241d140f; font-family: var(--f-display); font-size: .95rem }
.nav .next { background: var(--night); color: #f4f1ea; margin-inline-start: auto }
.nav .count { font-family: var(--f-display); color: var(--ink-2); font-size: .85rem }
.body.fade { animation: fade .45s ease }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } }
.fold { position: absolute; top: 10px; inset-inline-end: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: #241d140f; font-size: 1.1rem; line-height: 1 }

/* folded: only the dock stays */
.dock { pointer-events: auto; display: none; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: #0d1620b3; box-shadow: 0 10px 30px #0d162055 }
.dock button { border: 0; cursor: pointer; border-radius: 999px; height: 42px; padding: 0 16px; font-family: var(--f-display); font-size: .95rem; background: transparent; color: #f4f1ea; white-space: nowrap }
.dock .rays { background: var(--gold); color: #2a1d08 }
.dock .rays[aria-pressed="true"] { background: #fff1cc }
.stage.min .sheet { display: none }
.stage.min .dock { display: flex }

/* the story: the king tells it, a day passes from dawn at his face to dusk on both */
.dock .tell { background: #fbf7f0; color: #2a1d08 }
.chapters { display: none; gap: 4px; margin-top: .6rem; padding: 4px; border-radius: 999px; background: #0d1620a6; pointer-events: auto; align-items: center }
.chapters span { height: 34px; padding: 0 14px; display: grid; place-items: center; border-radius: 999px; font-family: var(--f-display); font-size: .9rem; color: #f4f1ea80; transition: background .6s, color .6s }
.chapters span.done { color: #f4f1ea }
.chapters span.on { background: var(--gold); color: #2a1d08 }
.chapters button { border: 0; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: #ffffff1a; color: #f4f1ea; font-size: .85rem }
.stage.telling .pieces { display: none }
.stage.telling .chapters { display: inline-flex }
.stage.telling .panel { display: none }
.subs { position: absolute; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none; justify-content: center; padding: 0 16px; pointer-events: none }
.stage.telling .subs { display: flex }
.subs p { margin: 0; max-width: 760px; text-align: center; font-size: clamp(1.05rem, 4.4vw, 1.45rem); line-height: 1.8; color: #fbf7f0; background: #0d1620b8; padding: 10px 20px; border-radius: 16px; box-shadow: 0 10px 30px #0d162055 }
.subs p.fade { animation: fade .6s ease }
.inset { position: absolute; left: 16px; top: 130px; width: 210px; height: 270px; border-radius: 18px; box-shadow: inset 0 0 0 2px var(--gold), 0 12px 34px #0d162077; pointer-events: none; opacity: 0; transition: opacity .8s }
.inset.on { opacity: 1 }
.inset span { position: absolute; inset-inline: 0; bottom: -32px; text-align: center; font-family: var(--f-display); font-size: .85rem; color: #fbf7f0; text-shadow: 0 1px 8px #000a }
@media (max-width: 899px) { .inset { left: 12px; top: 128px; width: 128px; height: 168px } }

.loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none }
.loading p { font-family: var(--f-display); color: #fbf7f0; text-align: center; padding: 0 24px; animation: breathe 1.6s ease-in-out infinite }
@keyframes breathe { 50% { opacity: .35 } }
@media (min-width: 900px) {
  .sky { inset-inline-end: 28px; top: 20px; width: 150px } .sky svg { width: 150px; height: 86px }
  .panel { justify-content: flex-end; padding-inline-end: 28px; bottom: 24px }   /* rtl: the card sits at the left, the sun stays clear */
  .stage.min .panel { justify-content: center }
  :root { --panel-h: min(46vh, 340px) }
  .inset { left: 28px; top: 170px; width: 230px; height: 300px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<main class="stage min" id="stage" dir="rtl" lang="ar" aria-label="تحت أشعة آتون: عرض ثلاثي الأبعاد">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="spots" id="spots" hidden></div>
  <div class="loading" id="loading"><p>تشرق الشمس على الحجر…</p></div>

  <div class="top">
    <h1>تحت أشعة آتون</h1>
    <p class="sub">العمارنة · نحو ١٣٤٥ قبل الميلاد</p>
    <div class="pieces" role="tablist" aria-label="القطع"><button role="tab" data-p="both" aria-selected="true">الاتنين</button><button role="tab" data-p="face" aria-selected="false">الوش</button><button role="tab" data-p="slab" aria-selected="false">اللوح</button></div>
    <div class="chapters" id="chapters"><span>الإنسان</span><span>الإله</span><span>اللقاء</span><button id="tellPause" aria-label="إيقاف مؤقت">❚❚</button><button id="tellStop" aria-label="إنهاء الحكاية">✕</button></div>
  </div>
  <div class="inset" id="inset"><span>الوجه نفسه… من الجنب</span></div>
  <div class="subs"><p id="line"></p></div>

  <div class="sky hint" id="sky">
    <svg viewBox="-54 -50 108 62" aria-label="حرّك الشمس ليتغيّر الضوء على النقش" role="slider" tabindex="0" id="skySvg">
      <line class="ground" x1="-52" y1="0" x2="52" y2="0"/>
      <path class="arc" d="M-46 0 A46 46 0 0 1 46 0"/>
      <g id="sunG"><line class="beam" id="beam" x1="0" y1="0" x2="0" y2="0"/><circle class="sun" r="7"/></g>
    </svg>
    <div class="lbl" id="skyLbl">حرّك الشمس</div>
  </div>

  <div class="panel">
    <div class="dock" id="dock">
      <button class="tell" id="tellBtn">▶ الحكاية</button>
      <button class="rays" id="rays" aria-pressed="false">☀ <span id="raysLabel">الشمس على الوش</span></button>
    </div>
    <section class="sheet" id="sheet" aria-live="polite">
      <button class="fold" id="fold" aria-label="إخفاء">⌄</button>
      <div class="body" id="body"><div class="kicker" id="kicker"></div><h2 id="title"></h2><div id="text"></div></div>
      <div class="nav">
        <button id="prev" aria-label="السابق">→</button>
        <span class="count" id="count"></span>
        <button class="next" id="next">التالي ←</button>
      </div>
    </section>
  </div>
</main>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* ---------------- what the rays touch ----------------
   at: [u, v] on the stone (u from its left, v up from the bottom). view: camera framing (r = share of the whole slab).
   ⚠ Identity of the original is NOT confirmed yet (HANDOFF.md): the copy stays descriptive and cautious. */
const DISK = [.77, .94];
const SLAB_CARDS = [
  { kicker: 'المصدر', title: 'قرص آتون', at: DISK, view: { u: .68, v: .8, r: .55 },
    html: '<p>في أعلى الحجر قرص الشمس: آتون، الإله الذي جعله إخناتون فوق كل الآلهة. لا يظهر في هيئة إنسان ولا حيوان، بل قرص تخرج منه أشعة طويلة، وفي آخر كل شعاع يد صغيرة.</p>' },
  { kicker: 'بجوار القرص', title: 'خرطوشان', at: [.91, .9], view: { u: .74, v: .8, r: .55 },
    html: '<p>إلى جانب القرص خرطوشان متجاوران. في فن العمارنة كان اسم آتون نفسه يُكتب داخل خرطوشين، كما يُكتب اسم الملك. ويُرجَّح أن هذين يحملان اسمه.</p>' },
  { kicker: 'في المقدمة', title: 'الملك', at: [.66, .66], view: { u: .58, v: .62, r: .62 },
    html: '<p>أطول الهيئات في المشهد هو الملك. يقف في المقدمة قريبًا من القرص، ويرفع ذراعيه بالقرابين نحوه. وعلى رأسه تاج طويل مائل إلى الخلف، يُرجَّح أنه التاج الأبيض.</p>' },
  { kicker: 'نهاية الأشعة', title: 'الأيادي', at: [.76, .55], view: { u: .74, v: .58, r: .5 },
    html: '<p>تأمّل نهايات الأشعة: كل شعاع ينتهي بكف مفتوحة. تمتد هذه الأيادي نحو الملك ونحو القرابين، كأن الشمس نفسها تمد يدها لتأخذ وتعطي.</p>' },
  { kicker: 'خلف الملك', title: 'الأسرة', at: [.26, .4], view: { u: .26, v: .38, r: .62 },
    html: '<p>خلف الملك هيئات أصغر من أسرته. ترفع إحداهن آلتين صغيرتين: صلاصل، تُهزّ في الطقوس فيرنّ معدنها. وفي فن العمارنة تظهر الأسرة الملكية مع الملك في العبادة، وهذا من أكثر ما يميّزه.</p>' },
  { kicker: 'أمام الملك', title: 'موائد القرابين', at: [.84, .3], view: { u: .82, v: .3, r: .5 },
    html: '<p>أمام الملك مائدتان عاليتان، تعلو كلًّا منهما باقة من الزهور. والأشعة تنزل عليهما مباشرة: القرابين للشمس.</p>' },
  { kicker: 'شكل الحجر', title: 'الحافة المائلة', at: [.22, .8], view: { u: .3, v: .75, r: .6 },
    html: '<p>الحافة المائلة في أعلى الحجر ليست كسرًا. في معابد العمارنة وقصورها كانت المنحدرات تُحاط بحواجز منخفضة، حافتها العليا مائلة لأنها تتبع ميل المنحدر، وكثيرًا ما زُيّنت بهذا المشهد نفسه: الأسرة الملكية تقدّم القرابين لآتون.</p>' +
      '<span class="src">Ian Shaw, Journal of Egyptian Archaeology 80 (1994)</span>' },
];
// the face: each card swings the sun (sun: dial position) to the light that shows its feature best
const FACE_CARDS = [
  { kicker: 'الوجه', title: 'ملك من العمارنة', at: [.5, .55], view: { r: 1, az: .3 }, sun: .55,
    html: '<p>وجه من الجص لملك من عصر العمارنة. وجه طويل، وعينان ضيقتان، وشفتان ممتلئتان، وذقن ممدود: ملامح عُرف بها إخناتون في فن عصره، ويُرجَّح أنه هو.</p>' },
  { kicker: 'على الجبهة', title: 'الصل', at: [.5, .9], view: { v: .88, r: .72, az: .45 }, sun: .9,
    html: '<p>فوق الجبهة تنتصب الكوبرا الملكية: الصل. كانت تحمي الملك وتنفث النار في وجه أعدائه، ولا يلبسها إلا الملك والملكة.</p>' },
  { kicker: 'غطاء الرأس', title: 'العصابة', at: [.24, .6], view: { v: .62, r: .78, az: -.4 }, sun: -.6,
    html: '<p>يحيط بالجبهة شريط عريض، ثم يرتفع غطاء الرأس الملكي فوقه. والصل مثبّت في مقدّمته.</p>' },
  { kicker: 'النظرة', title: 'العينان', at: [.33, .5], view: { v: .5, r: .7, az: -.3, el: .1 }, sun: -.85,
    html: '<p>عينان طويلتان ضيقتان، أجفانهما ثقيلة، تنظران إلى أسفل قليلًا. ضوء من الجانب يُظهر كيف حفر النحات تحت الجفن ليصنع الظل.</p>' },
  { kicker: 'الفم', title: 'الشفتان والذقن', at: [.5, .22], view: { u: .42, v: .3, r: .85, az: .5, el: -.05 }, sun: .95,
    html: '<p>شفتان ممتلئتان، عند طرفيهما خطان ينحدران إلى الذقن، والذقن نفسه طويل يمتد إلى الأمام. أدِر الوجه إلى جانبه لترى بروزه.</p>' },
  { kicker: 'ورش النحاتين', title: 'وجوه من الجص', at: [.72, .4], view: { r: .9, az: -.6 }, sun: -.4,
    html: '<p>في ورشة النحات تحتمس بالعمارنة عُثر عام ١٩١٢ على أكثر من عشرين وجهًا من الجص، منها وجوه لأفراد من الأسرة المالكة. كان النحاتون يستعملون الجص في دراسة الملامح قبل نحتها في الحجر.</p>' },
  { kicker: 'إلى اللوح', title: 'الملك نفسه تحت آتون', at: [.5, .38], view: { r: 1, az: .15 }, sun: .45,
    html: '<p>هذا الوجه نفسه تجده في اللوح المجاور: الملك واقفًا تحت قرص آتون، يرفع قرابينه والأشعة تمد إليه أيديها.</p><button class="go" data-go="slab">إلى الملك في اللوح ←</button>' },
];

/* ---------------- renderer: draws only when something changes ---------------- */
const stage = document.getElementById('stage'), canvas = document.getElementById('c');
const $ = id => document.getElementById(id);
const phone = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !phone, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const BG = 0x748ba1, FLOOR = 0x5c7287;
scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(34, 1, .05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minAzimuthAngle = -1.3; controls.maxAzimuthAngle = 1.3;   // about 75° each way: the full profile, never the back against the wall
controls.minPolarAngle = .5; controls.maxPolarAngle = 1.75;
controls.minDistance = .4; controls.maxDistance = 24;
controls.zoomToCursor = true;

// scale: 1 mm = 3/600 units (the slab is about 60 cm tall: an estimate)
const MM = 3 / 600;
const RELIEF = 4.0;            // mm, from tex.py
const T = 60 * MM;             // slab thickness: estimate
const LIFT = .95;
const FACE_X = -3.4;           // the face hangs on the same wall as the slab, to its left

const hemi = new THREE.HemisphereLight(0xfff4e6, FLOOR, .75); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0d6, 2.6); key.castShadow = true;
key.shadow.mapSize.set(phone ? 1024 : 2048, phone ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .5, far: 30 }); key.shadow.bias = -.0004; key.shadow.normalBias = .01;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xe8f0ff, .35); scene.add(fill, fill.target);

// each piece: its cards, its centre, its size, and where a (u, v) on it sits in the world
const PIECES = {

    const d = r.end.clone().sub(s), L = d.length();
    r.g.position.copy(s); r.g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    r.g.scale.set(1, Math.max(.001, (L - .1) * reach), 1); r.g.visible = reach > 0;
    r.hand.position.copy(s).addScaledVector(d, (L - .02) * reach); r.hand.material.opacity = THREE.MathUtils.smoothstep(reach, .8, 1);
  }
  orientHands();
  touch.position.copy(atenRays[0].end).add(new THREE.Vector3(0, .1, .8)); touch.intensity = THREE.MathUtils.smoothstep(reach, .85, 1) * 4;
  dirty = true;
}

// the same face, turned to its profile, beside the king on the stone
const insetCam = new THREE.PerspectiveCamera(26, 1, .05, 60), insetAnim = { on: false, start: 0 };
function poseInset(now) {
  const F = PIECES.face, k = Math.min(1, (now - insetAnim.start) / 2600), az = .3 + (-1.3 - .3) * ease(k);
  const t = new THREE.Vector3(FACE_X, F.center.y, F.z(.5, .5) * .55);
  insetCam.position.set(Math.sin(az), .08, Math.cos(az)).multiplyScalar(5.6).add(t); insetCam.lookAt(t);
  return k < 1;
}
function setInset(on) { if (on !== insetAnim.on) { insetAnim.on = on; insetAnim.start = performance.now(); $('inset').classList.toggle('on', on); dirty = true } }

function chapters(ch) { [...$('chapters').querySelectorAll('span')].forEach((s, i) => { s.classList.toggle('on', i === ch); s.classList.toggle('done', i < ch) }) }
function tellStep(i) {
  if (i >= STORY.length) return endTell();
  const s = STORY[i], now = performance.now();
  tell.i = i; tell.until = now + lineMs(s);
  const l = $('line'); l.textContent = s.say; l.classList.remove('fade'); void l.offsetWidth; l.classList.add('fade');
  chapters(s.ch); setInset(!!s.inset);
  if (PIECES[s.p] !== P) { P = PIECES[s.p]; makeSpots() }
  if (s.finale) {
    swingSun(s.sun, 2600);
    if (!atenAnim) {
      ray.tgt.set(...DISK); ray.on.value = .5; ray.reach.value = 0;          // the disk on the stone lights first
      flyTo(bothPose(.9, 2.2), 2800);
      atenAnim = { start: now + 900, ms: 5200 };
    }
    return;
  }
  const c = s.card !== undefined ? P.cards[s.card] : null;
  if (P === PIECES.slab && c) { ray.tgt.set(...(s.at || c.at)); beam = { start: now, ms: 900 } } else { ray.on.value = 0; beam = null }
  swingSun(s.sun, s.walk ? 3200 : 1800);
  const target = pose(s.view || c.view);
  if (s.walk) flyTo(target, 3600, new THREE.Vector3(0, .6, 4.5)); else flyTo(target, 1700);
}
function startTell() {
  setRays(false); setOpen(false); fly = null;
  tell = { i: 0, until: 0, paused: false, left: 0, audio: true };
  audio.currentTime = 0;
  audio.play().catch(() => { if (tell) { tell.audio = false; tell.until = performance.now() + lineMs(STORY[tell.i]) } });
  stage.classList.add('telling'); $('sky').classList.remove('hint'); resize();
  $('tellPause').textContent = '❚❚';
  tellStep(0);
}
function endTell() {
  audio.pause(); tell = null; atenAnim = null; setAten(0); setInset(false); ray.on.value = 0; beam = null;
  stage.classList.remove('telling'); $('skyLbl').textContent = 'حرّك الشمس';
  P = PIECES.both; makeSpots(); $('raysLabel').textContent = P.label; $('rays').hidden = true;
  document.querySelectorAll('.pieces button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === 'both'));
  resize(); swingSun(.55, 2000); flyTo(pose({ az: .3 }), 2600);
}
$('tellBtn').onclick = startTell;
$('tellStop').onclick = endTell;
$('tellPause').onclick = () => {
  if (!tell) return;
  tell.paused = !tell.paused;
  if (tell.audio) tell.paused ? audio.pause() : audio.play();
  else if (tell.paused) tell.left = tell.until - performance.now(); else tell.until = performance.now() + tell.left;
  $('tellPause').textContent = tell.paused ? '▶' : '❚❚';
};

/* ---------------- the sky dial ---------------- */
const sky = $('skySvg');
function skyFrom(e) {
  const r = sky.getBoundingClientRect();
  sunAnim = null; setSun(((e.clientX - r.left) / r.width - .5) * 2 / (92 / 108));
}
sky.addEventListener('pointerdown', e => { sky.setPointerCapture(e.pointerId); $('sky').classList.remove('hint'); skyFrom(e) });
sky.addEventListener('pointermove', e => { if (sky.hasPointerCapture(e.pointerId)) skyFrom(e) });
sky.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') setSun(sunS - .1); else if (e.key === 'ArrowRight') setSun(sunS + .1); else return;
  e.preventDefault();
});

/* ---------------- loop ---------------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;                    // a hidden tab has no size yet; the next resize sets it
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
  if (!Number.isFinite(camera.position.x)) { const p = pose({ az: .3 }); camera.position.copy(p.p); controls.target.copy(p.t) }
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
controls.addEventListener('change', () => dirty = true);
function tick(now) {
  if (fly) {
    const k = Math.min(1, (now - fly.start) / fly.ms), e = ease(k);
    camera.position.lerpVectors(fly.p0, fly.p, e); controls.target.lerpVectors(fly.t0, fly.t, e);
    if (fly.mid) camera.position.addScaledVector(fly.mid, 4 * e * (1 - e));
    if (k >= 1) fly = null; dirty = true;
  }
  if (beam) {
    const k = Math.min(1, (now - beam.start) / beam.ms);
    ray.on.value = Math.min(1, k * 3); ray.reach.value = ease(k);
    if (k >= 1) beam = null; dirty = true;
  }
  if (sunAnim) {
    const k = Math.min(1, (now - sunAnim.start) / sunAnim.ms);
    setSun(sunAnim.from + (sunAnim.to - sunAnim.from) * ease(k));
    if (k >= 1) sunAnim = null;
  }
  syncTell(now);
  if (atenAnim && now >= atenAnim.start) {
    const k = Math.min(1, (now - atenAnim.start) / atenAnim.ms);
    setAten(k); if (k >= 1) atenAnim = { start: Infinity };
  } else if (atenK > 0 && dirty) orientHands();
  let insetMoving = false;
  if (insetAnim.on) insetMoving = poseInset(now);
  if (controls.update()) dirty = true;
  if (dirty || insetMoving) {
    renderer.render(scene, camera); placeSpots(); dirty = false;
    if (insetAnim.on) {
      const r = $('inset').getBoundingClientRect(), s = stage.getBoundingClientRect(), y = s.bottom - r.bottom;
      insetCam.aspect = r.width / r.height; insetCam.updateProjectionMatrix();
      PIECES.slab.parts.forEach(o => o.visible = false); aten.visible = PIECES.face.wall.visible = false;
      renderer.setScissorTest(true); renderer.setViewport(r.left - s.left, y, r.width, r.height); renderer.setScissor(r.left - s.left, y, r.width, r.height);
      renderer.render(scene, insetCam);
      renderer.setScissorTest(false); renderer.setViewport(0, 0, stage.clientWidth, stage.clientHeight);
      PIECES.slab.parts.forEach(o => o.visible = true); PIECES.face.wall.visible = true; aten.visible = atenK > 0;
    }
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', resize);
build().then(() => {
  makeSpots(); resize(); setSun(.55); $('rays').hidden = true;
  const p = pose({ az: .3 }); camera.position.copy(p.p); controls.target.copy(p.t);
  $('loading').hidden = true; requestAnimationFrame(tick);
}).catch(err => { $('loading').querySelector('p').textContent = 'تعذّر التحميل. أعد تحميل الصفحة.'; console.error(err) });
</script>
