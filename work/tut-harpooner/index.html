<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملك على عوامة البردي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Special+Elite&display=swap">
<style>
:root {
  --bg: #748ba1;
  --paper: #f1e8d2;
  --paper-2: #e7dcc0;
  --ink: #2a2216;
  --ink-2: #6b5d45;
  --rule: #c7b186;
  --red: #9c3b2b;
  --gold: #d9a441;
  --f-display: "Reem Kufi", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
  --f-type: "Special Elite", "Courier New", monospace;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent }
canvas { display: block; width: 100%; height: 100%; touch-action: none }
.stage { position: fixed; inset: 0 }
header { position: absolute; top: max(14px, env(safe-area-inset-top)); inset-inline-start: 16px; inset-inline-end: 16px; pointer-events: none }
.kicker { font-family: var(--f-display); font-size: .85rem; color: #e9eef3; text-shadow: 0 1px 10px #0006 }
h1 { margin: .1rem 0 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.45rem, 6vw, 2.1rem); line-height: 1.2; color: #fbf7f0; text-shadow: 0 1px 14px #0005 }

.dock { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: #1c26318c; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: opacity .3s }
.dock button { border: 0; cursor: pointer; height: 42px; padding: 0 18px; border-radius: 999px; font-family: var(--f-display); font-size: .95rem; background: transparent; color: #f4f1ea; white-space: nowrap }
.dock button[aria-pressed="true"] { background: var(--gold); color: #2a1d08 }
.dock .num { font-family: var(--f-type); font-size: .95rem }

/* Carter's record card */
.card { position: absolute; left: 10px; right: 10px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 60px); max-height: 48vh; display: flex; flex-direction: column; background: var(--paper); border-radius: 6px; box-shadow: 0 10px 40px #0004; transform: translateY(calc(100% + 30px)); transition: transform .45s cubic-bezier(.2, .8, .2, 1) }
.card.open { transform: none }
.card .head { padding: 12px 16px 8px; border-bottom: 2px solid var(--red); display: flex; align-items: flex-start; gap: 10px }
.card .no { font-family: var(--f-type); font-size: 1.35rem; color: var(--red); line-height: 1; padding-top: 4px; direction: ltr }
.card .ttl { flex: 1 }
.card .ttl b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.35 }
.card .ttl small { color: var(--ink-2); font-size: .8rem }
.card .x { border: 0; background: none; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; font-size: 1.3rem; color: var(--ink-2) }
.rows { overflow-y: auto; overscroll-behavior: contain; padding: 0 0 8px }
.row { display: block; width: 100%; text-align: start; border: 0; border-bottom: 1px solid var(--rule); background: none; cursor: pointer; padding: 8px 16px 9px; font: inherit; color: inherit; border-inline-start: 3px solid transparent }
.row .k { font-family: var(--f-display); color: var(--ink-2); font-size: .82rem }
.row .v { font-size: .98rem; line-height: 1.55 }
.row .note { display: none; margin-top: 6px; font-size: .95rem; line-height: 1.75; color: var(--ink) }
.row[aria-expanded="true"] { background: var(--paper-2); border-inline-start-color: var(--red) }
.row[aria-expanded="true"] .note { display: block }

.mark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 2px #0003; pointer-events: none; opacity: 0; transition: opacity .4s; animation: ring 2.2s ease-in-out infinite }
.mark.on { opacity: 1 }
@keyframes ring { 50% { transform: scale(1.18) } }

.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .6s }
.loading p { font-family: var(--f-display); color: #fbf7f0; animation: breathe 1.6s ease-in-out infinite }
@keyframes breathe { 50% { opacity: .45 } }

@media (min-width: 900px) {
  .card { left: 20px; right: auto; top: 96px; bottom: 84px; width: 390px; max-height: none; transform: translateX(calc(-100% - 40px)) }
  .card.open { transform: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="الملك على عوامة البردي: عرض ثلاثي الأبعاد">
  <canvas id="c"></canvas>
  <div class="mark" id="mark"></div>
  <header>
    <div class="kicker">من مقبرة توت عنخ آمون</div>
    <h1>الملك على عوامة البردي</h1>
  </header>

  <section class="card" id="card" aria-label="بطاقة كارتر 275c">
    <div class="head">
      <span class="no">No. 275c</span>
      <div class="ttl"><b>تمثال الملك على عوامة من البردي</b><small>من بطاقة هوارد كارتر</small></div>
      <button class="x" id="close" aria-label="إغلاق">×</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <nav class="dock" id="dock">
    <button id="openCard" aria-pressed="false">بطاقة <span class="num">275c</span></button>
    <button id="spear" aria-pressed="false">الحربة</button>
    <button id="tell" aria-pressed="false">▶ الحكاية</button>
  </nav>
  <div class="loading" id="loading"><p>لحظة…</p></div>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('c');
const phone = matchMedia('(pointer: coarse)').matches;

/* Carter's card, line by line. at = model point the line is about; view = where the camera stands (az from the king's front, el, distance) */
const ROWS = [
  { k: 'الرقم', v: '275c، وله توأم يكاد يطابقه: 275e',

  { k: 'التاج', v: 'التاج الأحمر، تاج الوجه البحري، وعلى جبهته كوبرا من البرونز المذهّب',
    note: 'التاج الأحمر بقمته العالية المائلة إلى الخلف هو تاج الشمال، الدلتا. والكوبرا على الجبهة تحمي الملك وتنفث النار في وجه أعدائه.',
    at: [.045, .86, .06], view: { az: .5, el: .12, r: .15 } },
  { k: 'العينان', v: 'زجاج مطعّم',
    note: 'العينان من الزجاج، مكحّلتان بخط أسود يمتد نحو الصدغ. على الأصل الخشبي المذهّب كان هذا الزجاج يلمع فيبدو الوجه حيًا.',
    at: [.04, .77, .12], view: { az: .12, el: .05, r: .09 } },
  { k: 'اليد اليمنى', v: 'حربة', spear: true,
    note: 'الذراع مرفوعة والقبضة مثقوبة؛ من هذا الثقب كانت تمر الحربة، وهي من البرونز المذهّب. الملك في لحظة الرمي، قبل أن تنطلق.',
    at: [-.118, .885, .05], view: { az: -.75, el: .1, r: .3 } },
  { k: 'اليد اليسرى', v: 'شريط من البرونز ملفوف، ولعله الحبل', spear: true,

    at: [.1, .54, .284], view: { az: 1.05, el: .1, r: .17 } },
  { k: 'الزينة', v: 'قلادة من الخرز يتدلى منها المِنخت، ونقبة الشنديت',
    note: 'القلادة العريضة تغطي الكتفين، ويتدلى من خلفها على الظهر ثقل صغير يسمى المِنخت يوازنها. والنقبة هي الشنديت، نقبة الملوك ذات الثنيات الدقيقة.',
    at: [.04, .62, .04], view: { az: 2.6, el: .2, r: .2 } },
  { k: 'القدمان', v: 'الساقان متباعدتان، وفي القدمين صندل من البرونز المذهّب',
    note: 'خطوة واسعة واليسرى إلى الأمام، والجسد كله مائل في اتجاه الرمية. الصندل مذهّب كالجسد.',
    at: [.05, .2, .02], view: { az: 1.45, el: .12, r: .3 } },
  { k: 'العوامة', v: 'خشب ملوّن بالأخضر، وأربطتها وزهورها مذهّبة',
    note: 'ليست قاربًا من خشب، بل حزمة من سيقان البردي مربوطة، وفي طرفيها زهرة البردي. هكذا كان الصيادون يعبرون مستنقعات الدلتا.',
    at: [.04, .13, .4], view: { az: .7, el: .3, r: .16 } },
  { k: 'القاعدة', v: 'خشب مطلي بالراتنج الأسود، 70.5 × 18.5 سم، بلا كتابة',
    note: 'قاعدة سوداء ملساء لا اسم عليها ولا لقب. كل ما في التمثال يُقرأ من الهيئة وحدها.',
    at: [.04, .04, 0], view: { az: 1.2, el: .35, r: .5 } },
  { k: 'الوضع', v: '«في هيئة من يضرب أحد شياطين العالم الآخر»',
    note: 'هكذا وصفه كارتر. ويقرؤه كثيرون على أنه الملك في هيئة حورس يصطاد ستًّا، عدوّ أبيه أوزير، في صورة فرس النهر. والعدو نفسه لا يظهر في التمثال.',

/* ---------------- renderer, studio ---------------- */

const key = new THREE.DirectionalLight(0xfff0d6, 2.2); key.position.set(1.2, 2.4, 1.6); key.castShadow = true;

Object.assign(key.shadow.camera, { left: -.8, right: .8, top: .8, bottom: -.8, near: .5, far: 6 }); key.shadow.bias = -.0005; key.shadow.normalBias = .01;

floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* ---------------- the piece ---------------- */
const king = new THREE.Group(); scene.add(king);
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('model.glb');
gltf.scene.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true });
king.add(gltf.scene);
const at = a => new THREE.Vector3(...a);

const ghostMat = new THREE.MeshStandardMaterial({ color: 0xf3d27a, emissive: 0xd9a441, emissiveIntensity: .35, metalness: .3, roughness: .4, transparent: true, opacity: 0, depthWrite: false });

const ghost = new THREE.Group(); king.add(ghost);
{
  const fist = at([-.118, .885, .05]), dir = new THREE.Vector3(.05, -.55, 1).normalize();
  const back = .22, ahead = .62, len = back + ahead;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.0045, .0045, len, 10), ghostMat);

  shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

  head.position.copy(fist).addScaledVector(dir, ahead + .025); head.quaternion.copy(shaft.quaternion);
  // the cord (Carter: "a twisted ribbon of bronze", the one part NOT gilt): it runs through the grip of the left hand
  // (palm measured on the model: x .085–.115, y .532–.576, z .24–.32) and hangs in loops right under it
  const palm = at([.1, .556, .284]), R = .016, top = .53, pts = [palm.clone(), new THREE.Vector3(palm.x + R, top + .008, palm.z)];

const wide = () => innerWidth >= 900;
let shift = { x: 0, y: 0 }, shiftGoal = { x: 0, y: 0 }, free = { w: 1, h: 1 };
function resize() {

  camera.aspect = innerWidth / innerHeight; updateShift(); applyShift();
}
// the free rectangle: below the title, above the dock (phones: above the card), right of the card (desktop)
function updateShift() {
  const W = innerWidth, H = innerHeight, open = $('card').classList.contains('open'), c = $('card');
  const top = 92, bottom = !open || wide() ? H - 72 : H - (c.offsetHeight + 74 + 8), left = open && wide() ? c.offsetWidth + 40 : 0;
  shiftGoal = { x: W / 2 - (left + W) / 2, y: H / 2 - (top + bottom) / 2 };

}

let fly = null;

const ease = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;

/* ---------------- the card ---------------- */
let active = -1;
const rowsEl = $('rows');
ROWS.forEach((r, i) => {

  b.className = 'row'; b.setAttribute('aria-expanded', 'false');

  [-1, 'هكذا صنعوني… واقفًا على عوامة من البردي، في لحظة الصيد.'],

  [7, 'وهذه العوامة حزمة من سيقان البردي، في طرفيها زهرته… على مثلها كان الصيادون يعبرون مستنقعات الدلتا.'],

  [9, 'فمن أصيد؟'],
  [9, 'قال الذي وجدني: أضرب شيطانًا من شياطين العالم الآخر.'],
  [9, 'ويقول آخرون: إني حورس، أصيد ستًا، عدو أبي أوزير… ولا ترونه هنا.'],
  [0, 'وجدت في خزانة قبري، داخل صندوق أسود، ملفوفًا في الكتان.'],
  [0, 'ولم أكن وحدي… كان معي توأم يشبهني.'],
  [-1, 'والحربة… ما زالت مرفوعة.'],

// from web/narration.mp3 (91.9 s) by src/fit_cues.py; the four long pauses land on lines 12, 13, 15, 17
const CUES = [0.1, 2.32, 8.13, 14.79, 20.66, 27.51, 31.64, 35.83, 43.36, 49.65, 59.15, 64.23, 65.91, 71.2, 79.04, 84.96, 88.98];

let tale = null;
function taleLine(i) {

  tale.i = i;

function startTale() {
  stopTale(); spearByHand = false; setSpear(false);
  // the lines wait on the first line while the mp3 loads (slow phones); only if it can't play do they fall back to lineMs
  const a = new Audio('narration.mp3'), me = tale = { i: -1, t0: 0, audio: a, timed: false };
  $('tell').setAttribute('aria-pressed', true); $('tell').textContent = '■ إيقاف';
  a.play().then(() => { if (tale !== me) a.pause() }).catch(() => { if (tale === me) { me.audio = null; me.timed = true; me.t0 = performance.now() } });
  taleLine(0);
}
function stopTale() {
  if (!tale) return;
  tale.audio?.pause(); tale = null;
  $('tell').setAttribute('aria-pressed', false); $('tell').textContent = '▶ الحكاية';
}
// the tale ends where the page began: the piece alone, the card shut, no javelin
function endTale() { stopTale(); setTimeout(() => { if (!tale) { setSpear(false); openCard(false) } }, 1800) }
function tickTale(now) {
  if (!tale) return;
  if (!tale.timed) {
    if (!tale.audio) return;
    const t = tale.audio.currentTime;
    let i = 0; while (i + 1 < CUES.length && t >= CUES[i + 1]) i++;
    taleLine(i);
    if (tale.audio.ended) endTale();
    return;
  }
  let t = now - tale.t0, i = 0;
  while (i < TALE.length && t >= lineMs(TALE[i][1])) { t -= lineMs(TALE[i][1]); i++ }
  if (i >= TALE.length) endTale(); else taleLine(i);
}
$('tell').onclick = () => tale ? stopTale() : startTale();

/* ---------------- loop ---------------- */
addEventListener('resize', resize); resize();
{ const h = poseOf(HOME.view, at(HOME.at)); camera.position.copy(h.p); controls.target.copy(h.t) }
const v = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (fly) {
    const x = Math.min(1, (now - fly.start) / fly.ms), e = ease(x);
    camera.position.lerpVectors(fly.p0, fly.p, e); controls.target.lerpVectors(fly.t0, fly.t, e);
    if (x >= 1) fly = null;
  }
  const s = 1 - Math.exp(-dt * 7);
  if (Math.abs(shift.x - shiftGoal.x) > .3 || Math.abs(shift.y - shiftGoal.y) > .3) { shift.x += (shiftGoal.x - shift.x) * s; shift.y += (shiftGoal.y - shift.y) * s; applyShift() }
  ghostA += ((ghostOn ? .62 : 0) - ghostA) * (1 - Math.exp(-dt * 5)); ghostMat.opacity = cordMat.opacity = ghostA; ghost.visible = ghostA > .01;
  tickTale(now);
  controls.update();
  if (active > 0) {
    v.copy(at(ROWS[active].at)).project(camera);
    const m = $('mark').style; m.left = (v.x + 1) / 2 * innerWidth + 'px'; m.top = (1 - v.y) / 2 * innerHeight + 'px';
  }
  renderer.render(scene, camera);
});
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700);
</script>
